---
# Per-tenant Loki ingestion budgets, every onboarded tenant
# including 4087 (the platform itself - IaC Roadmap milestone,
# done: no longer special-cased in loki-values.yaml, goes
# through onboarding like everyone else) - applied by
# deploy:tenants via
# `helm upgrade loki --reuse-values -f loki-tenant-overrides.yaml`,
# which layers this file's loki.runtimeConfig.overrides map on top
# of whatever deploy:observability-stack already deployed (Helm deep-merges
# nested maps under --reuse-values). Nested under `loki:` to match the
# base file's own path - --reuse-values merges by path, a bare
# top-level `runtimeConfig:` here would land as an unrelated, ignored
# key instead of merging into loki.runtimeConfig.overrides.
loki:
  runtimeConfig:
    # Auto-generated by scripts/provision.py from manifests/ - do not hand-edit, changes here are overwritten on the next onboarding merge. Resize by editing the manifest instead.
    overrides:
      1229-prod:  # from 1229-windows-server-basis.yaml, env prod, size S (auto-provisioned)
        ingestion_rate_mb: 50
        ingestion_burst_size_mb: 100
        retention_period: 720h
      1286-prod:  # from 1286-linux-basis.yaml, env prod, size S (auto-provisioned)
        ingestion_rate_mb: 50
        ingestion_burst_size_mb: 100
        retention_period: 720h
      1294-prod:  # from 1294-netzwerk-basis.yaml, env prod, size M (auto-provisioned)
        ingestion_rate_mb: 50
        ingestion_burst_size_mb: 100
        retention_period: 720h
      4015-prod:  # from 4015-filestorage.yaml, env prod, size S (auto-provisioned)
