---
# Per-tenant Pyroscope ingestion budgets, every onboarded tenant
# including 4087, same convention as loki-tenant-overrides.yaml -
# applied by deploy:tenants via
# `helm upgrade pyroscope grafana/pyroscope --reuse-values -f pyroscope-tenant-overrides.yaml`,
# which layers this file's pyroscope.tenantOverrides map on top of
# whatever deploy:observability-stack already deployed (Helm deep-merges
# nested maps under --reuse-values). Confirmed live this session that
# Pyroscope actually enforces these (real HTTP 429 resource_exhausted
# rejections against a deliberately tiny test value, before this code
# was written) - pyroscope-values.yaml's own header comment previously
# said this was "deliberately not configured"; that's no longer true,
# see this file instead.
pyroscope:
  # Auto-generated by scripts/provision.py from manifests/ - do not hand-edit, changes here are overwritten on the next onboarding merge. Resize by editing the manifest instead.
  tenantOverrides:
    1229-prod:  # from 1229-windows-server-basis.yaml, env prod, size S (auto-provisioned)
      ingestion_rate_mb: 50
      ingestion_burst_size_mb: 100
      retention_period: 720h
    1286-prod:  # from 1286-linux-basis.yaml, env prod, size S (auto-provisioned)
      ingestion_rate_mb: 50
      ingestion_burst_size_mb: 100
      retention_period: 720h
    1294-prod:  # from 1294-netzwerk-basis.yaml, env prod, size M (auto-provisioned)
      ingestion_rate_mb: 50
      ingestion_burst_size_mb: 100
      retention_period: 720h
    4015-prod:  # from 4015-filestorage.yaml, env prod, size S (auto-provisioned)
      ingestion_rate_mb: 50
      ingestion_burst_size_mb: 100
      retention_period: 720h
    4087-prod:  # from 4087-cloud-container-plattform.yaml, env prod, size L (auto-provisioned)
      ingestion_rate_mb: 50
      ingestion_burst_size_mb: 100
      retention_period: 720h
    4711-prod:  # from 4711-mitarbeiterverzeichnis.yaml, env prod, size S (auto-provisioned)
      ingestion_rate_mb: 50
      ingestion_burst_size_mb: 100
      retention_period: 720h
    4720-prod:  # from 4720-otel-astronomy-shop-demo.yaml, env prod, size L (auto-provisioned)
      ingestion_rate_mb: 50
      ingestion_burst_size_mb: 100
      retention_period: 720h
    4721-prod:  # from 4721-kundenverwaltung.yaml, env prod, size M (auto-provisioned)
