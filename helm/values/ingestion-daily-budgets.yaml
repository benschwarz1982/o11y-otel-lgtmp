---
# Per-tenant, per-signal daily ingestion budget, every onboarded
# tenant including 4087 - see scripts/provision.py's
# compute_overrides() for the derivation (size tier only,
# independent of the generic per-second rate/burst limit every
# tenant shares - see that function's own comment for why the
# two are deliberately decoupled). Loki/Tempo/Pyroscope budgets
# are in bytes; Mimir's is in samples (its own native unit - see
# SIZE_MIMIR_SAMPLES_PER_DAY's comment for why there is no
# Mimir bytes value here). Each signal is enforced independently
# - NFR-05 finding: previously one blended byte budget summed
# across all four signals, which meant a tenant heavy on one
# signal could throttle its other, unrelated signals too, and
# blended together genuinely different bases (Loki/Tempo real
# uncompressed bytes, Pyroscope real but COMPRESSED bytes,
# Mimir a pure sample-count estimate) as if they were one unit.
# Read by the ingestion-midnight-snapshot CronJob (mounted as a
# plain file, not a Helm values file - no chart consumes this)
# to know when a tenant has crossed 100% of a given signal's own
# daily quota and should be throttled on that signal alone. The
# two __generic_..._mb__ keys (never a valid tenant_id shape)
# carry the same generic rate/burst every tenant's own
# runtime-config override uses - the enforcer reads them from
# here too, rather than a second, hand-maintained copy of the
# same two numbers. The per-tenant "storage" key is not a daily
# ingestion budget: it is the showback storage budget in bytes
# (G06, SIZE_STORAGE_GB), read by the storage-usage CronJob; the
# enforcer only looks at the four signal keys.

# Auto-generated by scripts/provision.py from manifests/ - do not hand-edit, changes here are overwritten on the next onboarding merge. Resize by editing the manifest instead.
__generic_rate_mb__: 50
__generic_burst_mb__: 100
