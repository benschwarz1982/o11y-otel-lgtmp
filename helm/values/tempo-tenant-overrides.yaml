---
# Per-tenant Tempo ingestion budgets, every onboarded tenant
# including 4087, same convention as mimir-tenant-overrides.yaml -
# applied by deploy:tenants via
# `helm upgrade tempo grafana-community/tempo-distributed --reuse-values -f tempo-tenant-overrides.yaml`,
# which layers this file's per_tenant_overrides map on top of
# whatever deploy:observability-stack already deployed (Helm deep-merges
# nested maps under --reuse-values). Confirmed live that
# Tempo actually enforces these (real tempo_discarded_spans_total{reason=
# "rate_limited"} increments against a deliberately tiny test value,
# before this code was written) - Tempo had no per-tenant budget at
# all before this file existed.
# Auto-generated by scripts/provision.py from manifests/ - do not hand-edit, changes here are overwritten on the next onboarding merge. Resize by editing the manifest instead.
per_tenant_overrides:
  1229-prod:  # from 1229-windows-server-basis.yaml, env prod, size S (auto-provisioned)
    ingestion:
      rate_strategy: local
      rate_limit_bytes: 52428800
      burst_size_bytes: 104857600
      max_traces_per_user: 10000
    metrics_generator:
      processors:
        - service-graphs
        - span-metrics
      generate_native_histograms: classic
      ingestion_time_range_slack: 0s
      native_histogram_bucket_factor: 1.1
      native_histogram_max_bucket_number: 100
      native_histogram_min_reset_duration: 15m0s
    compaction:
      block_retention: 720h
  1286-prod:  # from 1286-linux-basis.yaml, env prod, size S (auto-provisioned)
