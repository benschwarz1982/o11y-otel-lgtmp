---
# promtool test rules (run by scripts/test-rules.py). Checks the G04
# baseline alerts and the G08 status model of tenant 4721-prod. promtool
# always starts at the Unix epoch (Thursday 1970-01-01 00:00 UTC = 01:00
# local), so the series below are placed relative to that; the calendar
# formulas are tested at real dates by scripts/test-rules.py
# (rules/4721-prod/tests/calendar-cases.yaml).
rule_files:
  - ../baseline.yaml
  - ../status.yaml
evaluation_interval: 1m

tests:
  # --- baseline: 1 call/s for 3 weeks + 2h, then 3 calls/s ---
  # 3 weeks + 10h = 30840 minutes after the epoch: Thursday 10:00 UTC.
  - name: throughput spike above the weekly baseline
    input_series:
      - series: 'traces_spanmetrics_calls_total{service="kundenverwaltung"}'
        values: '0+60x30840 1850580+180x40'
    promql_expr_test:
      - {expr: kundenverwaltung:span_calls:baseline, eval_time: 30860m, exp_samples: [{labels: "kundenverwaltung:span_calls:baseline", value: 1}]}
    alert_rule_test:
      - eval_time: 30870m
        alertname: KundenverwaltungThroughputHighCritical
        exp_alerts:
          - exp_labels: {severity: critical, tenant: 4721-prod, alert_class: baseline}
            exp_annotations:
              summary: Kundenverwaltung throughput far above its weekly baseline
              description: "3 calls/s, more than baseline + max(60%, 4 stddev)."
      - eval_time: 30870m
        alertname: KundenverwaltungThroughputLowWarning
        exp_alerts: []

  # --- baseline: drop to 0.2 calls/s on a weekday morning ---
  - name: throughput drop below the weekly baseline during business hours
    input_series:
      - series: 'traces_spanmetrics_calls_total{service="kundenverwaltung"}'
        values: '0+60x30840 1850412+12x40'
    alert_rule_test:
      - eval_time: 30870m
        alertname: KundenverwaltungThroughputLowCritical
        exp_alerts:
          - exp_labels: {severity: critical, tenant: 4721-prod, alert_class: baseline}
            exp_annotations:
              summary: Kundenverwaltung throughput far below its weekly baseline during business hours
              description: "200m calls/s, less than baseline - max(60%, 4 stddev)."

  # --- G08 status model ---
  - name: status unknown without telemetry, functional with telemetry
    input_series:
      - series: 'target_info{job="x"}'
        values: '1x20 _x20'
    promql_expr_test:
      - expr: system:status:code
        eval_time: 5m
        exp_samples: [{labels: 'system:status:code{env="prod", system_id="4721", system_name="Kundenverwaltung", tenant="4721-prod"}', value: 0}]
      - expr: system:status:code
        eval_time: 35m
        exp_samples: [{labels: 'system:status:code{env="prod", system_id="4721", system_name="Kundenverwaltung", tenant="4721-prod"}', value: 2}]
  - name: SLO states - no SLI data or zero traffic (NaN) = unknown, fast burn = disrupted, slow burn = degraded
    input_series:
      - series: 'target_info{job="x"}'
        values: '1x40'
      - series: 'sloth_slo_info{sloth_id="kv-avail"}'
        values: '1x40'
      # SLI missing for 10 minutes, then 0, then NaN (no traffic), then 0
      - series: 'slo:sli_error:ratio_rate5m{sloth_id="kv-avail"}'
        values: '_x9 0x4 NaN NaN NaN NaN NaN 0x22'
      - series: 'slo:burn_alert:page{sloth_id="kv-avail"}'
        values: '_x20 1x5 _x15'
      - series: 'slo:burn_alert:ticket{sloth_id="kv-avail"}'
        values: '_x20 1x15 _x5'
    promql_expr_test:
      - expr: system:status:code
        eval_time: 5m
        exp_samples: [{labels: 'system:status:code{env="prod", system_id="4721", system_name="Kundenverwaltung", tenant="4721-prod"}', value: 2}]
      - expr: system:status:code
        eval_time: 12m
        exp_samples: [{labels: 'system:status:code{env="prod", system_id="4721", system_name="Kundenverwaltung", tenant="4721-prod"}', value: 0}]
      - expr: system:status:code
        eval_time: 17m
        exp_samples: [{labels: 'system:status:code{env="prod", system_id="4721", system_name="Kundenverwaltung", tenant="4721-prod"}', value: 2}]
      - expr: system:status:code
        eval_time: 23m
        exp_samples: [{labels: 'system:status:code{env="prod", system_id="4721", system_name="Kundenverwaltung", tenant="4721-prod"}', value: 3}]
      - expr: system:status:code
        eval_time: 33m
        exp_samples: [{labels: 'system:status:code{env="prod", system_id="4721", system_name="Kundenverwaltung", tenant="4721-prod"}', value: 1}]
