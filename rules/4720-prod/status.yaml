groups:
  - name: status-model
    interval: 1m
    rules:
      - record: system:telemetry:present
        expr: (count(last_over_time(target_info[10m])) > bool 0) or vector(0)
      - record: slo:sli_data:present
        expr: (slo:sli_error:ratio_rate5m == slo:sli_error:ratio_rate5m) * 0 + 1
      - record: system:slo:worst_status
        expr: max(label_replace(slo:burn_alert:page * 0 + 3, "term", "page", "", "") or label_replace(slo:burn_alert:ticket * 0 + 1, "term", "ticket", "", "") or label_replace((sloth_slo_info unless on(sloth_id)
          slo:sli_data:present) * 0 + 2, "term", "nodata", "", "")) or vector(0)
      - record: system:status:code
        expr: (vector(2) and on() (system:telemetry:present == 0)) or on() system:slo:worst_status
        labels:
          system_id: '4720'
          env: prod
          tenant: 4720-prod
          system_name: OTel Astronomy Shop Demo
