---
name: Self-service request
description: Onboard, update or offboard a system (normally opened by the self-service form on GitHub Pages)
title: "Self-service request"
labels: ["self-service"]
body:
  - type: markdown
    attributes:
      value: |
        Use the self-service form (GitHub Pages of this repository) - it fills in the request below.
        A workflow turns it into a pull request; the platform owner reviews and merges it.
        Only repository collaborators can trigger the workflow.
  - type: textarea
    id: request
    attributes:
      label: Request
      description: JSON generated by the self-service form
      render: json
    validations:
      required: true
