---
name: Azure setup
description: >-
  Sign in to Azure with GitHub OIDC (no stored secret) and optionally fetch
  the AKS kubeconfig. Expects ARM_CLIENT_ID, ARM_TENANT_ID and
  ARM_SUBSCRIPTION_ID in the job environment; Terraform uses the same
  identity through ARM_USE_OIDC.
inputs:
  kubeconfig:
    description: Also run ci/scripts/kubeconfig.sh (needs a running AKS cluster)
    default: "false"
runs:
  using: composite
  steps:
    - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906  # v3.1.0
      with:
        client-id: ${{ env.ARM_CLIENT_ID }}
        tenant-id: ${{ env.ARM_TENANT_ID }}
        subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}
    - if: inputs.kubeconfig == 'true'
      shell: bash
      run: ci/scripts/kubeconfig.sh
