---
name: CI images

# Builds the four CI tool images (ci/images/Dockerfile: base -> terraform
# -> ansible-linux / ansible-windows) every deploy job runs in, pushes
# them to GHCR with a build provenance attestation, then scans them.
# Tag :v1 is what the workflows pull (like the GitLab pipeline); every
# build is also tagged with its commit SHA.
on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]
    paths:
      - ci/images/**
      - .github/workflows/ci-images.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-images
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    # The deploy jobs run in these images with Azure access: only images
    # built from main may be published under the tags they pull.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    # One target at a time, in FROM order: each later target pulls the
    # layers it shares with the earlier ones from the GHA cache instead
    # of rebuilding them (and no two builds race on the same cache).
    strategy:
      max-parallel: 1
      matrix:
        target: [base, terraform, ansible-linux, ansible-windows]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - id: image
        env:
          OVERRIDE: ${{ vars.CI_IMAGE_PREFIX }}
          TARGET: ${{ matrix.target }}
        # GHCR image names must be lowercase.
        run: echo "name=${OVERRIDE:-ghcr.io/${GITHUB_REPOSITORY,,}/ci-tools}/${TARGET}" | tee -a "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ci/images
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:v1
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          # The source label links the GHCR package to this repository.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=ci-images
          cache-to: type=gha,scope=ci-images,mode=max
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  scan:
    name: Vulnerability scan
    needs: build
    uses: ./.github/workflows/image-scan.yml
    permissions:
      contents: read
      packages: read
