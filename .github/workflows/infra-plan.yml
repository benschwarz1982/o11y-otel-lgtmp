---
name: Infra plan

# Terraform plan of the AKS/network environment on every change to it on
# main (GitLab build:terraform-plan). Applying stays a manual Deploy run.
# Needs nothing from the management VM, so it runs on a GitHub-hosted
# runner; the "demo" environment is what the Azure identity trusts.
on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]
    paths:
      - terraform/environments/demo/**
      - terraform/modules/aks-cluster/**
      - terraform/modules/networking/**

permissions: {}

concurrency:
  group: infra-plan
  cancel-in-progress: true

jobs:
  plan:
    name: Terraform plan (infra)
    runs-on: ubuntu-latest
    environment: demo
    permissions:
      contents: read
      id-token: write
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
      TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
      TFSTATE_CONTAINER: ${{ vars.TFSTATE_CONTAINER }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false
      - run: ci/scripts/platform.sh infra plan
