---
name: Self-service request

# Turns a self-service request into a pull request (the GitLab
# pipeline's tenants:create-mr / update-mr / offboarding-mr). Requests
# come from the issue form (opened by the self-service page on GitHub
# Pages) or, for operators, from a manual run with the request JSON.
# Nothing is provisioned here: the platform owner reviews and merges the
# pull request, then the Tenants workflow rolls it out.
on:  # yamllint disable-line rule:truthy
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      request:
        description: Request JSON (same format as the self-service form generates)
        type: string
        required: true

permissions: {}

jobs:
  pull-request:
    name: Open pull request
    # Issue: only the self-service template, and only from people with
    # write access - the issue body is untrusted input either way and is
    # only ever read from the event file, never interpolated into a script.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.issue.labels.*.name, 'self-service') &&
       contains(fromJSON('["OWNER", "COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
    container: python:3.15.2-slim
    steps:
      # author_association COLLABORATOR also covers read/triage access:
      # require write access before acting on the issue.
      - name: Check the requester's permission
        if: github.event_name == 'issues'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              ...context.repo,
              username: context.payload.issue.user.login,
            });
            if (!['admin', 'maintain', 'write'].includes(data.role_name)) {
              core.setFailed(`${context.payload.issue.user.login} has ${data.role_name} access - write access is required.`);
            }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Pull requests opened with the job's own GITHUB_TOKEN do not start
      # workflows (no CI on them). With a GitHub App configured
      # (SELF_SERVICE_APP_ID + SELF_SERVICE_APP_PRIVATE_KEY) its token is
      # used instead and CI runs normally.
      - id: app
        if: vars.SELF_SERVICE_APP_ID != ''
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc  # v3.4.0
        with:
          app-id: ${{ vars.SELF_SERVICE_APP_ID }}
          private-key: ${{ secrets.SELF_SERVICE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - id: request
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token || github.token }}
          CI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CI_COMMIT_SHA: ${{ github.sha }}
          REQUEST: ${{ inputs.request }}
        run: |
          python3 -m venv /tmp/venv && . /tmp/venv/bin/activate
          pip install --quiet --upgrade pip
          pip install --quiet -r ci/requirements/onboarding.txt
          if [ "${GITHUB_EVENT_NAME}" = issues ]; then
            python3 scripts/self-service-request.py --event "${GITHUB_EVENT_PATH}"
          else
            python3 scripts/self-service-request.py --request "${REQUEST}"
          fi
      - name: Report back on the issue
        if: always() && github.event_name == 'issues'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          PR_URL: ${{ steps.request.outputs.pr_url }}
          OUTCOME: ${{ steps.request.outcome }}
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const ok = process.env.OUTCOME === 'success' && process.env.PR_URL;
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: ok
                ? `Pull request opened: ${process.env.PR_URL} - the platform owner reviews and merges it.`
                : `The request could not be turned into a pull request - see ${run}.`,
            });
            if (ok) {
              await github.rest.issues.update({ ...context.repo, issue_number: context.issue.number, state: 'closed', state_reason: 'completed' });
            }
