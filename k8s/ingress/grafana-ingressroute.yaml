---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana-ingress
  namespace: observability
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`grafana.sre.fs167.ch`)
      kind: Rule
      services:
        - name: grafana
          port: 80
  tls:
    secretName: grafana-tls-secret
