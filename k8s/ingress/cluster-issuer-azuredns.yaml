---
# Placeholders are Terraform templatefile() syntax, filled in by
# terraform/environments/observability-stack-crs/main.tf (from the
# cert_manager_client_id/dns_zone_name/acme_email variables and an azurerm_client_config data
# source) - see that module's README section B4. Deliberately no
# hardcoded clientID value: this used to be a recurring source of errors
# when the cert-manager service principal was rotated but this file was
# not (or no longer) updated manually to match.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-azuredns
spec:
  acme:
    # Empty = account without contact address (cert-manager omits it).
    email: "${acme_email}"
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-azuredns-account-key
    solvers:
      - dns01:
          azureDNS:
            clientID: ${cert_manager_client_id}
            clientSecretSecretRef:
              name: azuredns-config
              key: CLIENT_SECRET
            subscriptionID: ${azure_subscription_id}
            tenantID: ${azure_tenant_id}
            resourceGroupName: ${azure_resource_group}
            hostedZoneName: ${dns_zone_name}
            environment: AzurePublicCloud
