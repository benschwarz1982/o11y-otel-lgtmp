# Onboarding-scoped, symmetric to tenants:rollout - independent/freely
# runnable like the fleet-teardown jobs above, but must run BEFORE
# destroy:observability-stack (not after, unlike the fleet-* jobs) -
# see this stage's own top-of-file comment for why.
destroy:tenants:
  stage: destroy
  image:
    name: hashicorp/terraform:1.17.2
    entrypoint: [""]
  script:
    - !reference [.confirm_destroy, script]
    - !reference [.install_kubectl, script]
    - !reference [.terraform_init_tenants, script]
    - terraform destroy -auto-approve
  rules:
    - !reference [.skip_self_service_requests, rules]
    # Hidden on the onboarding MR-merge push itself - same changes:
    # filter tenants:apply/tenants:rollout use, so this only
    # fires in exactly the pipeline where those two are about to run.
    # A genuine human/infra push that doesn't touch manifests/**/*
    # falls through to the rule below unaffected.
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - manifests/**/*
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true
  environment:
    name: demo
    action: stop

# Reverse order from deploy: observability-stack-crs first (its
# kubernetes_manifest resources must go before the CRDs backing them
# do), then observability-stack itself. Needs destroy:tenants too (its
# gateway CR's null_resource still needs the OpenTelemetryCollector CRD
# this job's Helm release provides - see this stage's own top-of-file
# comment).
#
# needs: deploy:observability-stack (optional: true) too - same
# "skip if absent, wait if present" behavior as the seven jobs below:
# a no-op on any pipeline where deploy:observability-stack's own rules
# don't create it (this job stays freely, standalone runnable there,
# unchanged from before), but a real gate on a web-sourced run (where
# deploy:observability-stack always runs unattended, see the "deploy"
# stage's own comment) - this job only becomes runnable there once that
# same pipeline's deploy:observability-stack has actually succeeded, a
# same-pipeline "deploy, verify, tear down" smoke-test flow.
destroy:observability-stack:
  stage: destroy
  image:
    name: hashicorp/terraform:1.17.2
    entrypoint: [""]
  needs:
    - job: deploy:observability-stack
      optional: true
    - job: destroy:1286-linux-basis
      optional: true
    - job: destroy:1229-windows-basis
      optional: true
    - job: destroy:4720-otel-astronomy-shop
      optional: true
    - job: destroy:4721-kundenverwaltung
      optional: true
    - job: destroy:1294-netzwerk-basis
      optional: true
    - job: destroy:4015-filestorage
      optional: true
    - job: destroy:tenants
      optional: true
  script:
    - !reference [.confirm_destroy, script]
    - !reference [.terraform_init_observability_stack_crs, script]
    - terraform destroy -auto-approve
    - !reference [.terraform_init_observability_stack, script]
    - terraform destroy -auto-approve
  rules:
    - !reference [.skip_self_service_requests, rules]
    # Hidden on the onboarding MR-merge push itself - same changes:
    # filter tenants:apply/tenants:rollout use, so this only
    # fires in exactly the pipeline where those two are about to run.
    # A genuine human/infra push that doesn't touch manifests/**/*
    # falls through to the rule below unaffected.
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - manifests/**/*
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true
  environment:
    name: demo
    action: stop

