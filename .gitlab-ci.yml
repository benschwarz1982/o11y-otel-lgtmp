deploy-fleets:4721-kundenverwaltung:
  extends: .deploy_fleet
  image:
    name: hashicorp/terraform:1.17.2
    entrypoint: [""]
  before_script: []
  needs:
    - job: deploy:observability-stack
      optional: true
  script:
    # This environment includes Postgres too, Kundenverwaltung's own
    # dedicated database - see fleet-4139-postgresql/main.tf's own
    # header comment for why this directory keeps its old name.
    - !reference [.terraform_init_fleet_4139, script]
    # F25: keep the current instrumentation state. instrument=false
    # unconditionally used to strip the OTel agent/collector for a moment
    # whenever this job ran on an already instrumented deployment, until
    # deploy-instrumentations:4721 re-added them. A fresh deployment
    # still starts without telemetry (Demo Runbook step 2).
    # A state/backend error fails the job instead of reading as "not
    # instrumented"; only "no state yet" (fresh deployment) counts as false.
    - |
      if ! STATE_RESOURCES=$(terraform state list 2>/tmp/state-list.err); then
        grep -q 'No state file was found' /tmp/state-list.err || { cat /tmp/state-list.err; exit 1; }
        STATE_RESOURCES=""
      fi
    - |
      if printf '%s\n' "$STATE_RESOURCES" | grep -q '^kubernetes_manifest\.postgres_otel_collector'; then
        INSTRUMENT=true
      else
        INSTRUMENT=false
      fi
      echo "instrument=$INSTRUMENT (kept from current state)"
    - terraform apply -auto-approve -var instrument=$INSTRUMENT
  rules:
    - !reference [.skip_self_service_requests, rules]
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true
      changes:
        - terraform/environments/fleet-4139-postgresql/**/*
        - app/4721-kundenverwaltung/**/*

