        exit 1
      fi

build:terraform-plan:
  stage: build
  image:
    name: hashicorp/terraform:1.17.2
    entrypoint: [""]
  script:
    - !reference [.terraform_init, script]
    - terraform plan
  rules:
    - !reference [.skip_self_service_requests, rules]
    # No merge_request_event rule - this repo has no workflow that
    # actually opens an MR touching terraform/ (infra changes are
    # committed straight to main by hand; the only MRs this repo ever
    # generates are onboarding/offboarding ones, which only ever touch
    # manifests/). Found live: a merge_request_event rule here needs the
    # protected AZURE_* variables (ARM_CLIENT_ID etc., via
    # .terraform_init), which GitLab withholds from a merge request
    # pipeline unless both branches are protected - never true for an
    # onboarding/offboarding branch - so ARM_CLIENT_ID etc. ended up
    # empty and the azurerm provider's fallback to Azure CLI auth failed
    # outright in this az-cli-less image ("could not parse Azure CLI
    # version: launching Azure CLI: exec: \"az\": executable file not
    # found in \$PATH"). A changes: filter alone wasn't a full fix
    # either: an already-existing MR's pipeline still runs its source
    # branch's *own* .gitlab-ci.yml, not main's, so branches forked
    # before this fix landed keep hitting it regardless. Simplest
    # correct fix: drop the rule entirely - if a genuinely
    # Terraform-touching MR ever becomes a real workflow here, this can
    # be revisited then, on a branch protected from the start.
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - terraform/environments/demo/**/*
        - terraform/modules/aks-cluster/**/*
        - terraform/modules/networking/**/*

.setup_kubeconfig:
  script:
    - az login --service-principal -u "$AZURE_CLIENT_ID" -p "$AZURE_CLIENT_SECRET" --tenant "$AZURE_TENANT_ID" --output none
    - az account set --subscription "$AZURE_SUBSCRIPTION_ID"
    - az aks get-credentials -g "$AZURE_RESOURCE_GROUP" -n "$AKS_CLUSTER_NAME" --overwrite-existing
    - kubectl config current-context
    - kubectl get nodes

# ansible-core/terraform themselves now come from the ci-tools/ansible-*
# images (see ci/images/Dockerfile) - this is the one part of the old
# .install_ansible that ISN'T a package install and so still has to run
# per-job, every time: GitLab's docker executor checks the repo out
# world-writable, and Ansible treats an ansible.cfg found under a
# world-writable directory as untrusted and silently ignores it ("See
# deploy-instrumentations:1229-windows-basis's own comment" pattern
# below refers to this). Without this chmod, ansible/ansible.cfg's own
# [ssh_connection] pipelining = True never actually loads - a real
# performance regression for Linux targets, not just a log cleanup.
# Every job below that runs ansible-playbook references this.
.fix_ansible_cfg_perms:
  script:
    - chmod o-w ansible

# ---------------------------------------------------------------------------
# deploy stage - infra + platform; see the top-of-file comment.
# tenants:rollout lives in the "tenants" stage now, not here - see that
# stage's own comment.
# ---------------------------------------------------------------------------

deploy:infra:
  stage: deploy
  image:
    name: hashicorp/terraform:1.17.2
    entrypoint: [""]
  script:
    - !reference [.terraform_init, script]
    - terraform apply -auto-approve
  rules:
    - !reference [.skip_self_service_requests, rules]
    # Manual on both web and push - stays an operator decision (check
    # build:terraform-plan's own output first), deliberately not
    # unattended even on web: deploy:observability-stack's own needs:
    # chains off this job, so it only fires automatically once this one
    # has actually been triggered and finished, see that job's own
    # comment.
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true
      changes:
        - terraform/environments/demo/**/*
        - terraform/modules/aks-cluster/**/*
        - terraform/modules/networking/**/*
  environment:
    name: demo-infra

# Two sequential terraform applies in one job (not two separate CI jobs) -
# observability-stack-crs's kubernetes_manifest resources need
# observability-stack's Helm releases (OTel Operator/cert-manager/Traefik
# CRDs) to already exist in the live cluster before they can even be
# planned, so there's no useful way to split these across jobs/stages
# without reintroducing a needs: dependency that's really just this same
# ordering constraint one layer up - see terraform/environments/
# observability-stack-crs/versions.tf for the full reasoning, and
# README.md#d2 (client templates)/IaC Roadmap for the milestone this
# closes.
#
# `needs: [{job: deploy:infra, optional: true}]` below: `optional: true`
# only skips the dependency when deploy:infra is excluded from the
# pipeline by its own rules (an ordinary push not touching
# terraform/environments/demo/**) - on a web-sourced run deploy:infra's
# rules always match, so this job then genuinely waits for it to
# actually be triggered and finish. Deliberate: deploy:infra stays a
# manual operator decision (check build:terraform-plan's own output
# first - a no-op apply when nothing changed is cheap, but still worth
# a conscious click), while THIS job stays unattended - so the operator
# only ever clicks deploy:infra once, and deploy:observability-stack
# follows automatically the moment it succeeds, no second click needed.
deploy:observability-stack:
  stage: deploy
  image:
    name: hashicorp/terraform:1.17.2
    entrypoint: [""]
  needs:
    - job: deploy:infra
      optional: true
  script:
    - !reference [.install_kubectl, script]
    - !reference [.terraform_init_observability_stack, script]
    - terraform apply -auto-approve
    - !reference [.terraform_init_observability_stack_crs, script]
    - terraform apply -auto-approve
  rules:
    - !reference [.skip_self_service_requests, rules]
    # Unattended on web - see this job's own comment above and the
    # top-of-file "deploy" stage comment. Stays manual on push.
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true
      changes:
        - terraform/environments/observability-stack/**/*
        - terraform/environments/observability-stack-crs/**/*
        - helm/values/mimir-values.yaml
        - helm/values/loki-values.yaml
        - helm/values/tempo-values.yaml
        - helm/values/grafana-values.yaml
        - helm/values/pyroscope-values.yaml
        - helm/values/traefik-values.yaml
        - k8s/ingress/**/*
        - dashboards/shared/**/*
        - scripts/storage-usage.py
        - scripts/ingestion-midnight-snapshot.py
  environment:
    name: demo

# OpenClaw's own independent deploy job (README Open Points - ai-ops-azure
# integration) - separate Terraform state (terraform/environments/aiops)
# from deploy:observability-stack, so the AI/OpenClaw component of the
# demo can be deployed/destroyed on its own: running it is optional, not
# required for the rest of the pipeline. Its own "deploy-aiops" stage, after
# deploy-fleets/deploy-instrumentations rather than alongside
# deploy:observability-stack - found live: azurerm_virtual_machine_run_command.
# openclaw_ssh_key (installs OpenClaw's SSH key onto vm-rocky-demo) can
# only ever succeed once that fleet's VM actually exists, and every other
# OpenClaw resource here is otherwise fully independent of it (see that
# environment's own main.tf comments - VM IP is a plain variable default,
# not a live data source, specifically so this state doesn't hard-fail
# when the VM isn't up yet). No explicit needs: here on purpose - it
# would let this job start as soon as deploy:observability-stack
# finishes, jumping ahead of deploy-fleets/deploy-instrumentations
# despite being in a later stage (GitLab's needs: breaks the normal
# stage-order wait) - plain stage order is what actually guarantees
# vm-rocky-demo exists by the time this runs, as long as
# deploy-fleets:1286-linux-basis was triggered at some point first. If it
# wasn't, only the SSH-key-install resource fails - a legitimate,
# expected signal ("that fleet was skipped"), not a bug.
deploy-aiops:aiops:
  stage: deploy-aiops
  image:
    name: hashicorp/terraform:1.17.2
    entrypoint: [""]
  script:
    - !reference [.terraform_init_aiops, script]
    - terraform apply -auto-approve
  rules:
    - !reference [.skip_self_service_requests, rules]
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true
      changes:
        - terraform/environments/aiops/**/*
        - openclaw/**/*
        - sre/**/*
  environment:
    name: demo

# Onboarding-scoped, deliberately separate from deploy:observability-stack above:
# every onboarded tenant's own Mimir/Loki ingestion budgets, Grafana
# datasources/dashboards, and the 5 demo alert rules pinned to those
# same systems (moved here after a live bug - see
# terraform/environments/tenants/main.tf's own header comment and its
# alert_rules resource's own comment for the split rationale - own
# Terraform state, deliberately not observability-stack's). Runs in the
# SAME pipeline as
# tenants:apply (see this job's own rules/needs: for how) - not a
# second, commit-triggered pipeline like an earlier version of this
# design used (commit-author detection); still also runnable manually
# any time, e.g. after a full teardown
# (the manual rule's changes: filter only affects when the button shows
# up on a regular push pipeline with nothing tenants-relevant changed;
# a `web`-sourced "Run pipeline" always shows it, same escape hatch
# every other job in this file uses).
tenants:rollout:
  stage: tenants
  # ci-tools/terraform: base (kubectl/helm) + terraform - see
  # ci/images/Dockerfile. Replaces the old .install_tools/.install_terraform
  # bootstrap (kept only .setup_kubeconfig below, which stays dynamic
  # per-job az login/credentials, not bakeable).
  image: $CI_REGISTRY_IMAGE/ci-tools/terraform:v1
  # Same resource_group as tenants:apply above, same reason: this job's
  # own terraform apply (terraform/environments/tenants, a shared
  # remote state) and helm upgrade --reuse-values would otherwise race
  # too if several onboarding pipelines' rollouts overlapped. It locks
  # single jobs, not a pipeline's apply+rollout pair - the newest-wins
  # guard in the script handles pairs interleaving across pipelines.
  resource_group: tenants-provisioning
  # No needs: on deploy:observability-stack (an earlier version had
  # one) - found live: optional: true only skips the dependency when
  # the needed job is excluded by its own rules; deploy:observability-
  # stack's rules always match on a web-sourced run, so it's always
  # present, and since it in turn needs: deploy:infra (also present,
  # also manual), this job ended up blocked - no play button at all -
  # behind a two-job chain of unclicked manual buttons that have
  # nothing to do with rolling tenants out onto an already-deployed
  # stack. Same fix as deploy:observability-stack's own needs: removal
  # on deploy:infra (see that job's comment) - only tenants:apply is a
  # real same-pipeline dependency (this job downloads its artifact).
  needs:
    - job: tenants:apply
  before_script:
    - !reference [.setup_kubeconfig, script]
  script:
    # Work on the main tenants:apply verified (see its artifacts
    # comment) - always present, tenants:apply runs in every pipeline
    # this job can appear in (see both jobs' rules).
    - rm -rf .provisioned-main && mkdir .provisioned-main
    - tar -xzf provisioned-main.tar.gz -C .provisioned-main
    - cd .provisioned-main
    # Newest wins. resource_group serializes single jobs, not each
    # pipeline's apply+rollout pair, so with two merges in quick
    # succession `apply A, apply B, rollout B, rollout A` is possible -
    # and rollout A would put the older main back. The
    # ConfigMap below records the newest main a rollout has started; a
    # rollout of an older main skips. Reading and writing it inside this job is
    # safe: all rollouts share the resource_group. Ordered by
    # PROVISIONED_ORDER (see tenants:apply). --ignore-not-found: first
    # run has no state; any other kubectl error still fails.
    - |
      last_order=$(kubectl get configmap tenants-rollout-state -n observability --ignore-not-found -o jsonpath='{.data.commit_order}')
      last_sha=$(kubectl get configmap tenants-rollout-state -n observability --ignore-not-found -o jsonpath='{.data.commit_sha}')
      if [ -n "${last_order}" ] && [ "${PROVISIONED_ORDER}" -lt "${last_order}" ]; then
        echo "Skipping: main ${PROVISIONED_SHA} is older than ${last_sha}, which a newer pipeline already started rolling out."
        exit 0
      fi
    # Record this main BEFORE changing anything: if this
    # rollout then fails halfway, an older queued rollout must still not
    # overwrite what it already changed. Equal order passes the guard, so
    # retrying this job still works.
    - >
      kubectl create configmap tenants-rollout-state -n observability
      --from-literal=commit_sha="${PROVISIONED_SHA}"
      --from-literal=commit_order="${PROVISIONED_ORDER}"
      --dry-run=client -o yaml | kubectl apply -f -
    # Per-tenant Mimir/Loki ingestion budgets - stays a plain helm
    # step, not Terraform (see terraform/environments/tenants/main.tf's
    # own header comment for why). --reuse-values layers this file's
    # runtimeConfig.overrides map on top of whatever
    # deploy:observability-stack already deployed (Helm deep-merges
    # nested maps, verified live) - the base mimir/loki-values.yaml's
    # own runtimeConfig.overrides is deliberately empty (4087 is no
    # longer special-cased there, see IaC Roadmap). Mimir/Loki hot-reload
    # runtimeConfig from the resulting ConfigMap, no pod restart needed
    # (verified live via cortex_limits_overrides). Every CI job runs in
    # its own fresh container, so the "grafana" repo alias
    # observability-stack registered doesn't carry over - added again
    # here too.
    # Loki and Tempo moved to the grafana-community chart repo (Mimir and
    # Pyroscope are still published under grafana) - each release is
    # upgraded from the repo its helm_release in
    # terraform/environments/observability-stack uses.
    - helm repo add grafana https://grafana.github.io/helm-charts >/dev/null 2>&1 || true
    - helm repo add grafana-community https://grafana-community.github.io/helm-charts >/dev/null 2>&1 || true
    - helm repo update grafana grafana-community >/dev/null
    # Applies the tenant overrides only, never a chart upgrade: each
    # release is upgraded to the chart version it already runs (pinned by
    # `version` in terraform/environments/observability-stack/main.tf).
    # Without --version, helm upgrade moves to the newest chart in the
    # repo - every onboarding would silently upgrade Mimir/Loki/Tempo/
    # Pyroscope.
    - |
      for spec in mimir:grafana/mimir-distributed loki:grafana-community/loki tempo:grafana-community/tempo-distributed pyroscope:grafana/pyroscope; do
        release="${spec%%:*}"
        chart="${spec#*:}"
        version=$(helm get metadata "${release}" -n observability | awk '/^VERSION:/ {print $2}')
        if [ -z "${version}" ]; then
          echo "Could not read the deployed chart version of ${release}"
          exit 1
        fi
        # Before deploy:observability-stack moved a release to the
        # grafana-community chart (manual on push, so this job can run
        # first), its deployed version only exists in the grafana repo.
        if ! helm show chart "${chart}" --version "${version}" >/dev/null 2>&1; then
          chart="grafana/${chart#*/}"
        fi
        helm upgrade "${release}" "${chart}" -n observability --version "${version}" --reuse-values -f "helm/values/${release}-tenant-overrides.yaml"
      done
    # Per-tenant datasources/dashboards (picked up by Grafana's sidecars
    # without a restart) - terraform/environments/tenants.
    - !reference [.terraform_init_tenants, script]
    - terraform -chdir=terraform/environments/tenants apply -auto-approve
    # G03/G04/G08: per-tenant ruler rules (rules/<tenant>/, generated by
    # scripts/generate-rules.py) into the Mimir ruler. The ruler only
    # exists after deploy:observability-stack enabled it - until then
    # this step warns and skips instead of failing the rollout; re-run
    # tenants:rollout afterwards. PyYAML: older CI images lack it.
    - |
      python3 -c 'import yaml' 2>/dev/null || tdnf install -y -q python3-pyyaml >/dev/null
      if [ -z "$(kubectl -n observability get endpoints mimir-ruler -o jsonpath='{.subsets[*].addresses[*].ip}' 2>/dev/null)" ]; then
        echo "WARNING: Mimir ruler not running (deploy:observability-stack not yet applied?) - rule sync skipped, re-run tenants:rollout afterwards"
      else
        kubectl -n observability port-forward svc/mimir-ruler 18080:8080 >/tmp/pf.log 2>&1 &
        PF=$!
        for i in $(seq 1 30); do curl -sf http://localhost:18080/ready >/dev/null && break; sleep 2; done
        python3 scripts/sync-mimir-rules.py --url http://localhost:18080
        RC=$?
        kill $PF
        exit $RC
      fi
  rules:
    - !reference [.skip_self_service_requests, rules]
    # `if: web` deliberately comes FIRST here, same position as
    # tenants:apply's own rules - found live: with the push/changes
    # rule first instead, a plain "Run pipeline" (web) click fell
    # through to this job's second rule for its rules to apply at all.
    # Unattended here too (no `when: manual`), same as tenants:apply -
    # an earlier version of this file made this job a manual button on
    # web deliberately, but found live that's redundant friction, not a
    # real safety gate: the actual review already happened when the
    # onboarding MR was merged (same reasoning as
    # deploy:observability-stack following deploy:infra automatically,
    # see that job's own comment) - tenants:apply going green with this
    # job's button still sitting unclicked was easy to miss entirely in
    # practice (found live, chasing why a real onboarding's dashboard
    # fix never rolled out after a "Run pipeline" run: tenants:apply had
    # silently re-run its reconciliation while this job just sat
    # unclicked).
    - if: '$CI_PIPELINE_SOURCE == "web"'
    # Runs in the SAME pipeline as tenants:apply, not a second one -
    # this if:/changes: is deliberately identical to tenants:apply's
    # own auto-run rule, so both jobs get created together whenever an
    # onboarding MR merges (or any push to main touches manifests/**/*).
    # needs: tenants:apply (above) both sequences this job after it
    # in the DAG and downloads its artifact - the exact generated files
    # tenants:apply just produced, not a re-fetched/re-cloned copy.
    # Replaces an earlier version of this design that auto-ran via a
    # commit-author check instead, which only ever matched in a
    # SEPARATE, second pipeline (the one GitLab spins up for
    # tenants:apply's own follow-up push) - meaning the
    # merge-triggered pipeline itself never got past tenants:apply.
    # Still no trigger-token/pipeline-variable involved (see
    # tenants:apply's own comment on why that's a real
    # vulnerability, not just unused convenience) - this is pure
    # same-pipeline DAG ordering, nothing a caller can forge via a
    # trigger call.
    #
    # **Found live, still unexplained**: on the real onboarding run
    # this reordering was prompted by, this rule's own condition did
    # not fire on a genuine push that touched manifests/**/* (the
    # dashboard never rolled out until manually forced via a direct
    # kubectl patch, then this rule reorder). Structurally this rule
    # should be unconditional for any such push - no root cause
    # confirmed yet (no pipeline-trace/API access available to inspect
    # the actual before_sha/changes computation for that run). Flagged
    # here rather than silently assumed fixed by the reorder above,
    # which only addresses the confirmed `web`-source asymmetry.
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - manifests/**/*
        - helm/values/*-tenant-overrides.yaml
        - helm/values/ingestion-daily-budgets.yaml
        - collector-gateway/otel-gateway-collector.yaml
        - instrumentation/platforms/4087-container-platform/config.yaml
        - rules/**/*
        - slo/**/*
        - services/**/*
        - datasources/**/*
        - dashboards/**/*
        - tls-certs/**/*
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true
      changes:
        - terraform/environments/tenants/**/*
        - scripts/sync-mimir-rules.py
        - helm/values/mimir-tenant-overrides.yaml
        - helm/values/loki-tenant-overrides.yaml
        - helm/values/tempo-tenant-overrides.yaml
        - helm/values/pyroscope-tenant-overrides.yaml
        - datasources/**/*
        - dashboards/**/*
        - collector-gateway/otel-gateway-collector.yaml
        - alerting/**/*
  environment:
    name: demo

# ---------------------------------------------------------------------------
# deploy-fleets stage - provisions the demo fleet,
