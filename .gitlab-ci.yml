# ---------------------------------------------------------------------------
# deploy-instrumentations stage - adds OTel
# instrumentation to what fleet-* already provisioned, one job per fleet
# job. "Only for the demo" - in reality this would run in each platform/
# application's own repo, not here (see the top-of-file comment).
# ---------------------------------------------------------------------------

.instrument_fleet:
  stage: deploy-instrumentations
  # Never actually inherited unmodified - same story as .deploy_fleet
  # above (every real deploy-instrumentations:* job overrides image
  # either to a pure-Terraform image or one of the ci-tools/ansible-*
  # images, see ci/images/Dockerfile). Kept as a sane default.
  image: $CI_REGISTRY_IMAGE/ci-tools/base:v1
  before_script:
    - !reference [.setup_kubeconfig, script]
  rules:
    - !reference [.skip_self_service_requests, rules]
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true
  environment:
    name: demo

# Both below: Ansible over WinRM/SSH (IaC Roadmap milestone - a
# deliberate exception to this repo's usual `az vm run-command`-only
# rule, see ansible/README.md and README.md#b2). Credentials come from
# terraform/modules/client-vm's own outputs, read via `terraform
# output` against the matching fleet-1286-linux-basis/
# fleet-1229-windows-basis state (read-only - no terraform apply here,
# provisioning stays fleet-*'s job) - never committed, never persisted
# beyond this job's own ephemeral container.
deploy-instrumentations:1229-windows-basis:
  extends: .instrument_fleet
  # ci-tools/ansible-windows - see ci/images/Dockerfile and
  # deploy-fleets:4722-spesenabrechnung's own comment on this image.
  image: $CI_REGISTRY_IMAGE/ci-tools/ansible-windows:v1
  needs:
    - job: deploy-fleets:1229-windows-basis
      optional: true
  before_script:
    - !reference [.setup_kubeconfig, script]
    - !reference [.fix_ansible_cfg_perms, script]
  script:
    - export ARM_CLIENT_ID="$AZURE_CLIENT_ID"
    - export ARM_CLIENT_SECRET="$AZURE_CLIENT_SECRET"
    - export ARM_TENANT_ID="$AZURE_TENANT_ID"
    - export ARM_SUBSCRIPTION_ID="$AZURE_SUBSCRIPTION_ID"
    - sh "$CI_PROJECT_DIR/ci/gitlab/http-backend-override.sh" terraform/environments/fleet-1229-windows-basis
    - >
      terraform -chdir=terraform/environments/fleet-1229-windows-basis init
      -backend-config="address=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/fleet-1229-windows-basis"
      -backend-config="lock_address=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/fleet-1229-windows-basis/lock"
      -backend-config="unlock_address=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/fleet-1229-windows-basis/lock"
      -backend-config="username=gitlab-ci-token"
      -backend-config="password=${CI_JOB_TOKEN}"
      -backend-config="lock_method=POST"
      -backend-config="unlock_method=DELETE"
      -backend-config="retry_wait_min=5"
    - WINDOWS_IP=$(terraform -chdir=terraform/environments/fleet-1229-windows-basis output -raw public_ip_address)
    - WINDOWS_USER=$(terraform -chdir=terraform/environments/fleet-1229-windows-basis output -raw admin_username)
    - WINDOWS_PASS=$(terraform -chdir=terraform/environments/fleet-1229-windows-basis output -raw admin_password)
    # F08: pinned WinRM server certificate (modules/client-vm, pin-winrm-cert).
    - terraform -chdir=terraform/environments/fleet-1229-windows-basis output -raw winrm_server_cert_pem > /tmp/winrm-server.pem
    - !reference [.terraform_output_traefik_otlp_ip, script]
    - |
      cat > ansible/inventory/generated.ini << EOF
      [platform_linux]

      [platform_windows]
      vm-windows-demo ansible_host=$WINDOWS_IP ansible_user=$WINDOWS_USER ansible_password=$WINDOWS_PASS ansible_connection=winrm ansible_winrm_transport=basic ansible_winrm_server_cert_validation=validate ansible_winrm_ca_trust_path=/tmp/winrm-server.pem ansible_port=5986
      EOF
    - cd ansible
    # GitLab CI checks the repo out into a world-writable directory -
    # Ansible refuses to load ansible.cfg from one (a security check,
    # found live: "ignoring it as an ansible.cfg source", silently
    # dropping the inventory/roles_path settings, breaking both). Passed
    # explicitly instead of relying on cfg discovery, which still works
    # for a local/manual run from a normal directory.
    - export ANSIBLE_HOST_KEY_CHECKING=True
    - export ANSIBLE_ROLES_PATH="$(pwd)/roles"
    - ansible-playbook -i inventory/generated.ini playbooks/onboard-platform-windows.yml -e "traefik_otlp_ip=$TRAEFIK_OTLP_IP tenant_id=1229-prod deployment_environment=prod"
  rules:
    - !reference [.skip_self_service_requests, rules]
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true
      changes:
        - ansible/roles/platform-windows/**/*
        - ansible/roles/otlp_client_cert/**/*
        - ansible/playbooks/onboard-platform-windows.yml
        - ansible/playbooks/group_vars/all.yml
        - instrumentation/platforms/1229-windows-basis/config.yaml

