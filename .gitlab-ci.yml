# observability-stack/observability-stack-crs Terraform modules
# authenticate the kubernetes/helm providers directly via an
# azurerm_kubernetes_cluster data source (see those modules' versions.tf),
# not az aks get-credentials. The one remaining kubectl dependency is
# observability-stack's mimir_webhook_cleanup null_resource, which
# generates its own kubeconfig from that same data source - see that
# resource's own comment.
.install_kubectl:
  script:
    - apk add --no-cache curl
    # Same kubectl version as ci/images/Dockerfile.
    - KUBECTL_VERSION=1.37.3
    - curl -fsSLO "https://dl.k8s.io/release/v${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
    - echo "$(curl -fsSL "https://dl.k8s.io/release/v${KUBECTL_VERSION}/bin/linux/amd64/kubectl.sha256")  kubectl" | sha256sum -c -
    - chmod +x kubectl && mv kubectl /usr/local/bin/kubectl

