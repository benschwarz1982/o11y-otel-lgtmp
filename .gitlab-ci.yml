---
# Deploy/destroy pipeline for the observability stack (AKS). Every job
# name is prefixed `<stage>:<name>` (one deliberate exception: `pages`, a hard
# GitLab convention, not a style choice - see that job's own comment) -
# stage order:
#   - "validate" lints everything (yamllint/shellcheck/ruff/ansible-lint/
#     manifest-schema/terraform fmt+validate/hadolint/kubeconform) and
#     scans it (gitleaks secret scan, trivy misconfiguration scan,
#     pip-audit on the pinned Python requirements),
#     independent of the stages below. Placed first so
#     a lint/schema problem is caught before anything else even starts;
#     on a web-sourced "Run pipeline" every validate:* job runs
#     unattended regardless of what changed (see each job's own rules).
#   - "build" plans the infra change (build:terraform-plan) and also
#     (re)builds the 4 pre-built images every azure-cli-based job below
#     pulls from instead of bootstrapping its own tools at run time
#     (build:ci-image-* - see ci/images/Dockerfile's own header for why).
#     build:terraform-plan runs unattended on both a push and a
#     web-sourced run; build:ci-image-* runs unattended only on a push
#     that actually touches ci/images/Dockerfile, and stays a manual,
#     optional (`allow_failure: true`) button on a web-sourced run - a
#     full manual "Run pipeline" is normally for exercising the rest of
#     the pipeline, not for rebuilding images nothing else in that run
#     actually needs.
#   - "deploy" carries out: deploy:infra (AKS/network) then
#     deploy:observability-stack (LGTM stack - platform-scoped Grafana
#     content only: shared dashboards, the one genuinely tenant-agnostic
#     datasource), `needs:` chained in that order (see
#     deploy:observability-stack's own comment). deploy:infra is
#     `when: manual` on both web and push - an operator decision, check
#     build:terraform-plan's own output first - but on a web-sourced
#     "Run pipeline" deploy:observability-stack itself is unattended:
#     the moment deploy:infra is manually triggered there and succeeds,
#     it follows automatically with no second click (on push it stays
#     `when: manual` too, gated on its own `changes:` filter, same as
#     every other manual job here). Both are Terraform-managed
#     (terraform/environments/demo,
#     terraform/environments/observability-stack + observability-stack-crs
#     respectively) - deploy:observability-stack runs two sequential
#     `terraform apply`s in one job, see that job's own comment for why
#     it's not two jobs.
#   - "deploy-fleets" provisions the demo fleet: nine deploy-fleets:*
#     jobs, the demo VMs/apps - provisioning only, deliberately no
#     telemetry yet.
#   - "deploy-instrumentations" adds telemetry on top: nine
#     deploy-instrumentations:* jobs, mirrored 1:1 with deploy-fleets:*,
#     adding OTel instrumentation on top of what deploy-fleets:* already
#     provisioned. "Only for the demo" - stands in for what would be each
#     platform/application's own repo pipeline doing self-service
#     instrumentation in reality.
#
#     The deploy-fleets:*/deploy-instrumentations:* jobs are staged in
#     dependency tiers, ID-named: platform-basis (1229/1286/1294/4015,
#     only need deploy:observability-stack) -> the applikationen tier that builds
#     on a specific base (4711/4720/4721/4722 - 4711 doubles as the
#     erweiterungen tier too via the underlying 1295+4711 script, see
#     that script's own comment for why). Each deploy-instrumentations:*
#     job only needs its own deploy-fleets:* job - unlike an earlier
#     version of this pipeline, an application-tier
#     deploy-instrumentations:* job does NOT need its base tier's own
#     deploy-instrumentations:* job anymore: every application pushes its
#     own OTLP straight to the gateway with its own tenant
#     (instrumentation/middleware/), it no longer relays through a local platform
#     collector, so there's nothing left for the platform's own
#     instrumentation step to provide it. Ordering
#     between all of these jobs is expressed via `needs:` (GitLab DAG)
#     across the deploy-fleets/deploy-instrumentations stage boundary,
#     not via extra stages per tier - each `needs:` target is
#     `optional: true` so any job can also be run standalone (e.g. only
#     re-instrumenting one system
#     against an already-provisioned fleet).
#   - "tenants" (IaC Roadmap milestone, done - folded in from the
#     now-retired observability-otel-demo-onboarding repo) carries out
#     a platform/application owner's self-service request
#     (form -> tenants:create-mr -> MR -> review -> tenants:apply,
#     reconciling every manifest's Mimir/Loki ingestion budgets, Grafana
#     datasources/dashboards, and the gateway's tenant allowlist - see
#     docs/self-service.md#onboarding) -> tenants:rollout, in the same
#     pipeline (needs: + a matching rule, see that job's own comment).
#     tenants:rollout's own Terraform state also deploys the 5 demo
#     alert rules now (moved from deploy:observability-stack - see
#     terraform/environments/tenants/main.tf's own comment) - fixed,
#     hand-authored content, not manifest-generated like the rest of
#     this stage, but rolled out on the same cadence since they're
#     pinned to these same onboarded systems.
#     Deliberately decoupled from the deploy-fleets/deploy-instrumentations
#     stages - can run any time a manifest actually gets merged, not tied
#     to when the fleet happens to be (re)provisioned.
#   - "destroy" mirrors "deploy"/"deploy-fleets"/"tenants" in reverse:
#     destroy:*/destroy:tenants -> destroy:observability-stack ->
#     destroy:infra. Unlike deploy, this is a real dependency chain, not
#     just decoupled manual jobs: the six destroy:* fleet-teardown jobs
#     and destroy:tenants stay independent/freely runnable (no `needs:`)
#     - the two demo VMs and the Filestorage Storage Account aren't part
#     of the AKS cluster or Terraform state, so their destroy:* jobs are
#     the only way to clean them up regardless of what happens to the
#     cluster - but destroy:observability-stack needs all seven of them
#     (optional: true, so it's still runnable standalone) and
#     destroy:infra needs destroy:observability-stack in turn.
#     destroy:observability-stack also needs deploy:observability-stack
#     (optional: true too) - on an ordinary pipeline where
#     deploy:observability-stack's own rules don't even create it, this
#     is a no-op exactly like the other seven; on a web-sourced "Run
#     pipeline" (where deploy:observability-stack is at least present,
#     see "deploy" above) it becomes a real gate: destroy:observability-stack
#     only becomes runnable once that same pipeline's own
#     deploy:observability-stack has actually succeeded - a same-pipeline
#     "deploy, verify, tear down" smoke-test flow, see that job's own
#     comment.
#     destroy:tenants specifically must run before
#     destroy:observability-stack, not after (unlike the fleet-teardown
#     jobs, order doesn't matter among those) - its gateway CR's
#     null_resource shells out to `kubectl delete opentelemetrycollector`
#     on destroy, which needs the OpenTelemetryCollector CRD schema
#     observability-stack's own Helm release installs to still be
#     present, mirroring the same CRD-must-exist-first reasoning the
#     deploy-side ordering already has (see terraform/README.md). Found
#     live: without the fleet-teardown/observability-stack ordering it's
#     easy to end up with orphaned resources the fleet-teardown scripts
#     don't know about
#     (e.g. each demo VM's NSG, created implicitly by `az vm create` and
#     not cleaned up by the original destroy-fleet-1286-linux-basis.sh/
#     destroy-fleet-1229-windows-basis.sh scripts at the time - since
#     fixed) - forcing the fleet-teardown tier to run first, every time,
#     catches gaps like that instead of the AKS cluster deletion
#     silently working around them. No separate destroy jobs mirroring
#     deploy-instrumentations:* - destroying the underlying deploy-fleets:*
#     resource (VM, namespace) already takes whatever
#     deploy-instrumentations:* added down with it. destroy:* jobs never
#     get a `changes:` filter (see below) - tearing something down isn't
#     tied to what changed in a given push. They do have two narrow
#     `when: never` exclusions ahead of that unconditional availability
#     (an onboarding MR-merge push, and tenants:apply's own follow-up
#     push) - see .destroy_fleet's own comment.
#
# Most jobs run only when relevant files changed (`rules: changes:`),
# to keep routine pushes from cluttering the pipeline view with buttons
# for things that don't apply - see each job's own `rules:` for exactly
# which paths it watches. To force the *entire* pipeline to appear
# regardless (a "complete start"), start it manually via GitLab's own
# "Run pipeline" page (Pipelines > Run pipeline) - every job's rules
# include an `if: '$CI_PIPELINE_SOURCE == "web"'` branch ahead of its
# changes-filtered one specifically for this. Every job that's meant to
# stay manual (everything except validate:*/build:terraform-plan/pages/
# tenants:apply, which are meant to run unattended) needs `when:
# manual` on THIS branch too, not just the push-triggered one below it -
# found live: without it, GitLab's rules default to `when: on_success`,
# so a "complete start" via Run pipeline auto-ran deploy:infra instead of
# just making it available to click. destroy:* jobs are the one
# exception: always available, no changes: filter at all (see above,
# aside from the two narrow onboarding-related exclusions).
#
# Every `changes:`-filtered rule's own `if:` explicitly includes
# `$CI_PIPELINE_SOURCE == "push"` (not just `$CI_COMMIT_BRANCH ==
# $CI_DEFAULT_BRANCH`) - found live: `rules: changes:` has no real git
# diff to compare against for a pipeline with no actual push event
# (trigger-API pipelines, e.g. tenants:create-mr's own pipeline;
# also true for scheduled/tag pipelines), so GitLab evaluates it as
# unconditionally true in that case - every `changes:`-gated job across
# the *entire* pipeline showed up on what should have been a narrowly
# scoped tenants:create-mr trigger call, not just that one job.
# Restricting the branch-comparison rule to genuine push events avoids
# this entirely (GitLab's own documented recommendation for this
# exact gotcha).
#
# Prerequisite: CI/CD variables AZURE_CLIENT_ID, AZURE_CLIENT_SECRET,
# AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID (AZURE_CLIENT_SECRET masked+protected) -
# the Service Principal is ALWAYS created by hand via "az ad sp create-for-rbac",
# never by this pipeline (see README.md section A3). Access to the AKS
# cluster is fetched dynamically via "az aks get-credentials" instead of via
# a static kubeconfig secret - previously that would go stale every time the
# cluster was recreated via Terraform.
#
# Optional: CI/CD variables CERT_MANAGER_CLIENT_ID, CERT_MANAGER_CLIENT_SECRET
# (CERT_MANAGER_CLIENT_SECRET masked+protected) - also ALWAYS created by hand
# via "az ad sp create-for-rbac" (README section A6, only needs the already
# existing DNS zone, no "deploy:infra" required).
# Without these two variables, terraform/environments/observability-stack/
# skips the azuredns-config secret and observability-stack-crs skips the
# ClusterIssuer/Certificate/IngressRoute entirely (both keyed off
# cert_manager_client_id being empty), but the rest of
# deploy:observability-stack still runs through.
#
# The azurerm/azuread Terraform provider only picks up credentials
# automatically via HashiCorp's own ARM_* naming convention - .terraform_init
# therefore briefly maps the AZURE_* variables to ARM_* before Terraform
# runs.
#
# Every job that runs "pip install" creates and activates a venv first
# (python3 -m venv .venv && . .venv/bin/activate) - a standing convention
# for this file, not just to silence pip's "running as root" warning:
# each job's container is single-use and destroyed after the job anyway,
# so the venv doesn't protect anything a system-wide install wouldn't
# already be safe doing here - it's kept for consistency across every
# Python-using job regardless of base image. Also upgrades pip itself
# right after (negligible cost, a few hundred KB) purely to silence its
# own "new release available" notice in every job's log. What gets
# installed is never named inline: every job installs a fully pinned
# ci/requirements/<set>.txt (see that directory's README for how to
# regenerate one) - validate:python-deps audits all of them.
#
# CONFIRM_DESTROY=yes (CI/CD variable, set only on the "Run pipeline" form)
# is required by every destroy:* job - a plain safety gate against
# accidental manual-job clicks.

# Self-service requests (form/index.html opens GitLab's "Run pipeline"
# page with SYSTEM_ID / UPDATE_SYSTEM_ID / OFFBOARDING_SYSTEM_ID
# prefilled) run as ordinary "web" pipelines on main. Every job except
# validate:yaml, validate:manifests and the three tenants:*-mr jobs
# starts its rules with this reference, so such a pipeline contains only
# those - not the builds, plans and manual deploy/demo jobs a plain web
# run offers. (They used to be "trigger" pipelines, kept apart by
# source; the public trigger token is gone.)
.skip_self_service_requests:
  rules:
    - if: '$SYSTEM_ID || $UPDATE_SYSTEM_ID || $OFFBOARDING_SYSTEM_ID'
      when: never

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    # Only "push" on main - a bare branch check would admit every
    # source on main, "trigger" included.
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    # No "trigger" source: the self-service form used to start pipelines
    # with a pipeline trigger token embedded in its public page. It now
    # opens GitLab's own "Run pipeline" page (pipeline source "web"), so
    # every request is made by an authenticated project member - see
    # form/index.html. "api" is the same request scripted with the
    # caller's own token (README, Onboarding Process) - only for
    # self-service requests.
    - if: '$CI_PIPELINE_SOURCE == "api" && ($SYSTEM_ID || $UPDATE_SYSTEM_ID || $OFFBOARDING_SYSTEM_ID)'
    # Pipeline schedules exist for exactly two jobs: validate:python-deps
    # and build:ci-image-scan (a new CVE shows up without any change in
    # this repo). Every other job's rules name
    # the pipeline sources they run on explicitly, and none of them names
    # "schedule" - keep it that way when adding a job, or it starts
    # running unattended on every schedule.
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

stages:
  - validate
  - build
  - deploy
  - deploy-fleets
  - deploy-instrumentations
  - deploy-aiops
  - tenants
  - demo
  - destroy

default:
  tags:
    - otel-demo

variables:
  KUBE_NAMESPACE: observability
  # AZURE_RESOURCE_GROUP, DNS_ZONE (e.g. sre.example.com) and optionally
  # ACME_EMAIL are project CI/CD variables (README, section A); Terraform
  # gets them as its required inputs.
  TF_VAR_resource_group_name: $AZURE_RESOURCE_GROUP
  TF_VAR_dns_zone_name: $DNS_ZONE
  TF_VAR_acme_email: $ACME_EMAIL
  AKS_CLUSTER_NAME: aks-otel-demo
  TF_STATE_NAME: demo
  TF_ADDRESS: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/${TF_STATE_NAME}"

# ---------------------------------------------------------------------------
# build stage (ci-image-* part) - builds/pushes the 4 images
# ci/images/Dockerfile defines, straight to this project's own GitLab
# Container Registry, alongside build:terraform-plan further below (same
# stage, unrelated to each other - no needs: between them).
# $CI_REGISTRY/$CI_REGISTRY_IMAGE/$CI_REGISTRY_USER/$CI_REGISTRY_PASSWORD
# are GitLab predefined variables, automatically available in every job
# for this project's own registry - unlike AZURE_*/CERT_MANAGER_* above,
# no manual CI/CD variable setup needed (same
# gitlab-ci-token/$CI_JOB_TOKEN pattern tenants:rollout's own Terraform
# HTTP backend config already uses, just for the registry instead of
# Terraform state). Kaniko, not Docker-in-Docker: no dind/privileged-mode
# usage exists anywhere else in this repo/runner config, and Kaniko is
# the standard rootless option for building images from inside a regular
# (non-privileged) CI job.
#
# Unattended (no `when: manual`) on a real change to ci/images/Dockerfile
# on a push to main - nothing else about that push needs asking. On a
# web-sourced "Run pipeline" (this repo's existing "force the whole
# pipeline to appear" escape hatch, see this file's own top comment)
# these stay `when: manual` + `allow_failure: true` instead: a full
# manual run is normally for exercising the rest of the pipeline
# (onboarding, a demo, a destroy), not for rebuilding images that
# haven't changed - available to click, never forced, never blocks
# anything else in that run if left unclicked.
.build_ci_image:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  script:
    - mkdir -p /kaniko/.docker
    - >
      echo "{\"auths\":{\"${CI_REGISTRY}\":{\"username\":\"${CI_REGISTRY_USER}\",\"password\":\"${CI_REGISTRY_PASSWORD}\"}}}"
      > /kaniko/.docker/config.json
    # --cache/--cache-repo: all 4 targets share the base/terraform
    # stages (see ci/images/Dockerfile's own FROM chain) - without
    # this, every build:ci-image-* job would re-execute those shared
    # stages from scratch instead of reusing what an earlier job in
    # the same chain already built.
    - >
      /kaniko/executor
      --context "${CI_PROJECT_DIR}/ci/images"
      --dockerfile "${CI_PROJECT_DIR}/ci/images/Dockerfile"
      --target "${CI_IMAGE_TARGET}"
      --destination "${CI_REGISTRY_IMAGE}/ci-tools/${CI_IMAGE_TARGET}:v1"
      --cache=true
      --cache-repo "${CI_REGISTRY_IMAGE}/ci-tools/cache"
  rules:
    - !reference [.skip_self_service_requests, rules]
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - ci/images/Dockerfile

# Chained via needs: (base -> terraform -> {ansible-linux,
# ansible-windows} in parallel), not all 4 fully parallel - found live:
# since every --target build independently walks the FULL stage chain
# from the top, 4 parallel jobs each redundantly rebuilt the shared
# base/terraform stages AND raced to push the exact same --cache-repo
# tag for them at once. Kaniko's cache push has no documented
# concurrency guarantee for that (multiple known upstream issues about
# --cache-repo not being reliably reused across parallel/concurrent
# builds against the same registry), and Kaniko stops consulting the
# cache entirely for the rest of a build after its first miss - so one
# lost race poisoned the whole job's caching, not just that one layer.
# needs: makes each shared stage build+push exactly once per pipeline
# run before anything depending on it starts, at the cost of losing
# 4-way parallelism - acceptable here since this stage only ever runs
# on a real Dockerfile change, not on every pipeline.
build:ci-image-base:
  extends: .build_ci_image
  variables:
    CI_IMAGE_TARGET: base

build:ci-image-terraform:
  extends: .build_ci_image
  needs: ["build:ci-image-base"]
  variables:
    CI_IMAGE_TARGET: terraform

# ansible-core==2.21.3 pinned in ci/images/Dockerfile - read straight
# from a real build of this job's own `pip install ansible-core` log
# output (Kaniko prints it, unlike the old job-level
# `pip install --quiet`), not guessed.
build:ci-image-ansible-linux:
  extends: .build_ci_image
  needs: ["build:ci-image-terraform"]
  variables:
    CI_IMAGE_TARGET: ansible-linux

# Same live-verified pin as ansible-linux above, plus pywinrm==0.5.0.
build:ci-image-ansible-windows:
  extends: .build_ci_image
  needs: ["build:ci-image-terraform"]
  variables:
    CI_IMAGE_TARGET: ansible-windows

# Vulnerability scan (trivy) of the 4 images just built - OS packages
# and the Python/Go dependencies baked into them. allow_failure: these
# images inherit whatever mcr.microsoft.com/azure-cli ships, so a
# HIGH/CRITICAL CVE with an available fix is something to look at, not
# something that should block the deploy jobs. --ignore-unfixed: only
# report what an image rebuild/base bump can actually resolve.
# TRIVY_USERNAME/TRIVY_PASSWORD: same predefined registry credentials
# .build_ci_image pushes with. On a web-sourced run the build jobs are
# manual (see .build_ci_image), so this one is too and scans whatever
# :v1 currently is, without waiting for a rebuild (needs: []). Same on
# a pipeline schedule, just unattended.
# --image-src remote: pull from the registry, never the runner's local
# docker cache - found live: trivy's default order (docker first) picked
# up stale :v1 images (Azure Linux 3) instead of the freshly pushed ones.
build:ci-image-scan:
  stage: build
  image:
    name: ghcr.io/aquasecurity/trivy:0.76.2
    entrypoint: [""]
  needs: ["build:ci-image-ansible-linux", "build:ci-image-ansible-windows"]
  allow_failure: true
  variables:
    TRIVY_USERNAME: "${CI_REGISTRY_USER}"
    TRIVY_PASSWORD: "${CI_REGISTRY_PASSWORD}"
  script:
    - |
      rc=0
      for target in base terraform ansible-linux ansible-windows; do
        echo "== ${target}"
        trivy image --image-src remote --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed "${CI_REGISTRY_IMAGE}/ci-tools/${target}:v1" || rc=1
      done
      exit $rc
  rules:
    - !reference [.skip_self_service_requests, rules]
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      needs: []
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      needs: []
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - ci/images/Dockerfile

validate:yaml:
  stage: validate
  image: alpine:3.24.4
  script:
    - apk add --no-cache yamllint
    # Found live, twice already (see validate:python/validate:shell's
    # own comments for the same class of gap): a directory-scoped
    # invocation silently misses real content anywhere else - here it
    # missed all of examples/*.yaml and even .gitlab-ci.yml itself
    # (which does get real value out of this: turned up a genuine
    # missing "---" once actually checked). Whole repo instead.
    - >
      yamllint -d "{extends: default, rules: {line-length: disable}}"
      .
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "**/*.yaml"
        - "**/*.yml"
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "api" && ($SYSTEM_ID || $UPDATE_SYSTEM_ID || $OFFBOARDING_SYSTEM_ID)'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - "**/*.yaml"
        - "**/*.yml"

validate:shell:
  stage: validate
  image: koalaman/shellcheck-alpine:stable
  script:
    # scripts/ has held zero .sh files since deploy-tenants.sh (the
    # last one) moved to Terraform - the remaining shell scripts used
    # to live under examples/tomcat-demo-app/ only, which is what this
    # job originally checked - found live: that missed
    # terraform/environments/demo/init.sh and
    # ansible/roles/middleware-tomcat/files/tomcat-traffic-generator.sh
    # entirely, in any pipeline, ever (same class of gap as
    # validate:python's own scripts/*.py-only glob, see Known
    # Pitfalls). find instead of a glob, to actually cover the whole
    # repo and not silently miss a future .sh file added anywhere else.
    - find . -name "*.sh" -not -path "./.git/*" -exec shellcheck {} +
  rules:
    - !reference [.skip_self_service_requests, rules]
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "**/*.sh"
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - "**/*.sh"

validate:python:
  stage: validate
  image: python:3.15.2-slim
  script:
    - python3 -m venv .venv && . .venv/bin/activate && pip install --quiet --upgrade pip
    # Pinned (ci/requirements/python-lint.txt), like every other tool
    # version in this pipeline - an unpinned ruff picked up new default
    # rules (RUF013, BLE001) from an upstream release and would have
    # failed this job with no code change on this repo's side.
    - pip install --quiet -r ci/requirements/python-lint.txt
    # Found live: scripts/*.py only ever covered scripts/ itself - a
    # non-recursive, single-directory glob - so instrumentation/platforms/object-storage/
    # workload.py (the only other .py file in this repo) silently never
    # got linted at all, in any pipeline, ever. Check the whole repo
    # instead - ruff already skips .git/venvs/etc. on its own.
    - ruff check .
  rules:
    - !reference [.skip_self_service_requests, rules]
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "**/*.py"
        - ci/requirements/python-lint.txt
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - "**/*.py"
        - ci/requirements/python-lint.txt

# G03/G04/G08: rules/ in sync with its sources (OpenSLO files in slo/,
# manifests, services/business-services.yaml - scripts/generate-rules.py
# --check, with Sloth) and correct (scripts/test-rules.py: promtool check
# rules, the tenants' unit tests and calendar cases). Sloth and promtool
# come with the CI image (ci/images/Dockerfile); an image built before
# they were added makes this job exit 77 = warning, not a silent pass.
validate:rules:
  # Stage build, not validate: it needs the (re)built CI image of this
  # same pipeline, and needs: can't point at a later stage.
  stage: build
  image: $CI_REGISTRY_IMAGE/ci-tools/terraform:v1
  needs:
    - job: build:ci-image-terraform
      optional: true
  allow_failure:
    exit_codes: [77]
  script:
    - python3 -c 'import yaml' 2>/dev/null || tdnf install -y -q python3-pyyaml >/dev/null
    - |
      if ! command -v sloth >/dev/null || ! command -v promtool >/dev/null; then
        echo "CI image has no sloth/promtool yet (rebuilt by build:ci-image-terraform on main) - rules NOT validated"
        exit 77
      fi
    - python3 scripts/generate-rules.py --check
    - python3 scripts/test-rules.py
  rules:
    - !reference [.skip_self_service_requests, rules]
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: &rules_paths
        - rules/**/*
        - slo/**/*
        - services/**/*
        - manifests/**/*
        - scripts/generate-rules.py
        - scripts/test-rules.py
        - ci/images/Dockerfile
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: *rules_paths

# ansible-lint, not just validate:yaml's yamllint above - checks
# Ansible-specific idioms (undefined-looking module refs, deprecated
# syntax, etc.), not just YAML syntax. Config: ansible/.ansible-lint
# (two rules skipped there, see that file's own comments for why).
# ansible.windows collection installed explicitly (not the full
# "ansible" pip package) so roles/middleware-dotnet's/platform-windows's
# win_* modules resolve, same collection baked into the
# ci-tools/ansible-windows image (see ci/images/Dockerfile) the
# deploy-instrumentations:*-windows-basis jobs use.
validate:ansible:
  stage: validate
  image: python:3.15.2-slim
  # Installs the full "ansible" pip package, not ansible-core - it
  # bundles ansible.windows already (needed to resolve
  # roles/middleware-dotnet's/platform-windows's win_* modules), no
  # separate `ansible-galaxy collection install` call needed. Found
  # live: that call kept hitting galaxy.ansible.com outages here
  # ("Missing expected 'results' in ansible-galaxy cache", then "HTTP
  # Code: 502, Bad Gateway" even with --no-cache and retry: 2) - this
  # sidesteps the Galaxy network dependency entirely for a job that only
  # needs the collection to resolve module names, not track its latest
  # version.
  script:
    - python3 -m venv .venv && . .venv/bin/activate && pip install --quiet --upgrade pip
    - pip install --quiet -r ci/requirements/ansible-lint.txt
    # GitLab's docker executor checks out the repo world-writable, so
    # Ansible refuses to load ansible/ansible.cfg from it at all
    # ("Ansible is being run in a world writable directory... ignoring
    # it as an ansible.cfg source") - a security check on Ansible's own
    # side, no config setting can suppress the warning (it fires before
    # config is even loaded). Fixed at the source instead of ignoring
    # it: strip the world-write bit so the check passes and the file
    # actually loads.
    - chmod o-w ansible
    - cd ansible && ansible-lint
  rules:
    - !reference [.skip_self_service_requests, rules]
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - ansible/**/*
        - ci/requirements/ansible-lint.txt
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - ansible/**/*
        - ci/requirements/ansible-lint.txt

validate:manifests:
  stage: validate
  image: python:3.15.2-slim
  script:
    - python3 -m venv .venv && . .venv/bin/activate && pip install --quiet --upgrade pip
    - pip install --quiet -r ci/requirements/onboarding.txt
    - python3 scripts/validate-manifests.py
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - manifests/**/*
        - ci/requirements/onboarding.txt
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "api" && ($SYSTEM_ID || $UPDATE_SYSTEM_ID || $OFFBOARDING_SYSTEM_ID)'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - manifests/**/*
        - ci/requirements/onboarding.txt

# Fails a merge request whose committed generated files (scripts/
# provision.py output) don't match its manifests - they are committed
# in the MR now, not pushed to main after the merge (see
# scripts/provisioning_sync.py). The onboarding/update/offboarding MR
# jobs include them automatically; a hand-written MR, or one rebased
# onto a newer main, needs `python3 scripts/provision.py` + commit.
# The job log lists the stale files.
provision:check:
  stage: validate
  image: python:3.15.2-slim
  script:
    - python3 -m venv .venv && . .venv/bin/activate && pip install --quiet --upgrade pip
    - pip install --quiet -r ci/requirements/onboarding.txt
    - python3 scripts/provisioning_sync.py --check
  rules:
    - !reference [.skip_self_service_requests, rules]
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - manifests/**/*
        - scripts/provision.py
        - scripts/provisioning_sync.py
        - scripts/generate-system-dashboard.py
        - ci/requirements/onboarding.txt
        - helm/values/*-tenant-overrides.yaml
        - helm/values/ingestion-daily-budgets.yaml
        - collector-gateway/otel-gateway-collector.yaml
        - datasources/**/*
        - dashboards/**/*
        - tls-certs/**/*

# pip-audit over every pinned requirements file the jobs in this file
# install from (ci/requirements/*.txt) - fails on any known
# vulnerability in a pinned version. --no-deps/--disable-pip: the files
# are already fully resolved by pip-compile, so nothing is installed or
# re-resolved here, the pins are just looked up. Only on a change to
# those files, a web-sourced run or a pipeline schedule, deliberately
# not on every pipeline:
# a newly published CVE would otherwise fail unrelated onboarding MRs
# ("Pipelines must succeed" is enabled). Not covered: ansible-core/
# pywinrm in ci/images/Dockerfile (build:ci-image-scan's trivy scan
# sees those) and the unpinned pip install in
# terraform/environments/fleet-4015-filestorage's workload Deployment.
validate:python-deps:
  stage: validate
  image: python:3.15.2-slim
  script:
    - python3 -m venv .venv && . .venv/bin/activate && pip install --quiet --upgrade pip
    - pip install --quiet -r ci/requirements/audit.txt
    - |
      rc=0
      for file in ci/requirements/*.txt; do
        echo "== ${file}"
        pip-audit --progress-spinner off --disable-pip --no-deps -r "${file}" || rc=1
      done
      exit $rc
  rules:
    - !reference [.skip_self_service_requests, rules]
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - ci/requirements/*
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - ci/requirements/*

# terraform fmt + validate across every environment - until now nothing
# checked Terraform before a real apply except build:terraform-plan, and
# that only ever plans the "demo" state. No backend, no ARM_* variables:
# `init -backend=false` only downloads providers/modules, `validate` is
# purely static - so unlike build:terraform-plan this is safe on a merge
# request pipeline too (no protected variables needed). Deliberately a
# plain `init`, not `-lockfile=readonly`: the committed lock files don't
# carry a linux_amd64 h1 hash for every provider, and a read-only init
# then fails validate with "does not match any of the checksums recorded
# in the dependency lock file". TF_PLUGIN_CACHE_DIR shares one provider
# download across all environments instead of one per environment.
validate:terraform:
  stage: validate
  image:
    name: hashicorp/terraform:1.17.2
    entrypoint: [""]
  variables:
    TF_PLUGIN_CACHE_DIR: "${CI_PROJECT_DIR}/.terraform-plugin-cache"
  script:
    - mkdir -p "${TF_PLUGIN_CACHE_DIR}"
    - terraform fmt -check -recursive -diff terraform
    - |
      rc=0
      for dir in terraform/environments/*/; do
        echo "== ${dir}"
        (cd "${dir}" && terraform init -backend=false -input=false >/dev/null && terraform validate -no-color) || rc=1
      done
      exit $rc
  rules:
    - !reference [.skip_self_service_requests, rules]
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - terraform/**/*
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - terraform/**/*

# hadolint on the one Dockerfile this repo has. --failure-threshold
# error, not the default: the Dockerfile currently has one known
# warning (DL4006, the `curl | bash` helm install without pipefail) -
# fixing it means touching the Dockerfile, which rebuilds and overwrites
# all four ci-tools/*:v1 images every deploy job depends on. The warning
# stays visible in this job's log; tighten this back to the default once
# that install is replaced.
validate:dockerfile:
  stage: validate
  image:
    name: hadolint/hadolint:v2.15.1-alpine
    entrypoint: [""]
  script:
    - hadolint --failure-threshold error ci/images/Dockerfile
  rules:
    - !reference [.skip_self_service_requests, rules]
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - ci/images/Dockerfile
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - ci/images/Dockerfile

# Schema validation of every Kubernetes resource this repo keeps as
# plain YAML - validate:yaml only checks YAML syntax, not whether a
# Certificate/IngressRoute/OpenTelemetryCollector actually matches its
# CRD. Explicit paths, not the whole repo: alerting/ (Grafana
# provisioning files, `apiVersion: 1`) and the plain collector configs
# under instrumentation/ are not Kubernetes resources. CRD schemas come
# from datreeio/CRDs-catalog, pinned to a commit like every other
# version here; -strict also rejects unknown fields. retry: the schemas
# are fetched from GitHub at run time.
validate:k8s:
  stage: validate
  image:
    name: ghcr.io/yannh/kubeconform:v0.8.0-alpine
    entrypoint: [""]
  variables:
    CRD_CATALOG_REF: 89c736bdde38b5fecd0f8436ec5f3aa3679a3b86
  retry: 2
  script:
    - >
      /kubeconform -strict -summary
      -schema-location default
      -schema-location "https://raw.githubusercontent.com/datreeio/CRDs-catalog/${CRD_CATALOG_REF}/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json"
      k8s tls-certs datasources collector-gateway
      instrumentation/applications/4721-kundenverwaltung/postgres-otel-collector.yaml
      instrumentation/platforms/4087-container-platform/config.yaml
  rules:
    - !reference [.skip_self_service_requests, rules]
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - k8s/**/*
        - tls-certs/**/*
        - datasources/**/*
        - collector-gateway/**/*
        - instrumentation/**/*.yaml
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - k8s/**/*
        - tls-certs/**/*
        - datasources/**/*
        - collector-gateway/**/*
        - instrumentation/**/*.yaml

# Secret scan over the full git history with gitleaks' built-in rule
# set - fails on any finding. GIT_DEPTH 0: the default shallow clone
# would only cover the most recent commits. Config + the one deliberate
# exception (the self-service form's public pipeline trigger token):
# .gitleaks.toml. Run directly instead of GitLab's own Secret-Detection
# template: that template's job never fails on a finding, it only
# uploads a report this project's tier has no UI for. No changes:
# filter - a secret can land in any file.
validate:secrets:
  stage: validate
  image:
    name: ghcr.io/gitleaks/gitleaks:v8.30.1
    entrypoint: [""]
  variables:
    GIT_DEPTH: "0"
  script:
    # The checkout belongs to a different user than the one this
    # container runs as - git refuses to read it otherwise ("detected
    # dubious ownership").
    - git config --global --add safe.directory "${CI_PROJECT_DIR}"
    - gitleaks git --no-banner --redact --verbose .
  rules:
    - !reference [.skip_self_service_requests, rules]
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# Misconfiguration scan (Terraform, Dockerfile, Kubernetes YAML) with
# trivy - fails on any HIGH/CRITICAL finding that is not part of the
# baseline of findings that already existed when this job was added:
# inline `#trivy:ignore` comments on the affected Terraform resources,
# plus .trivyignore.yaml (see its own header). Only new ones fail here. MEDIUM/LOW are deliberately not reported at all yet - one
# threshold to keep green first.
validate:iac:
  stage: validate
  image:
    name: ghcr.io/aquasecurity/trivy:0.76.2
    entrypoint: [""]
  script:
    - >
      trivy config --exit-code 1 --severity HIGH,CRITICAL
      --ignorefile .trivyignore.yaml .
  rules:
    - !reference [.skip_self_service_requests, rules]
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: &iac_paths
        - terraform/**/*
        - ci/images/Dockerfile
        - k8s/**/*
        - tls-certs/**/*
        - datasources/**/*
        - collector-gateway/**/*
        - instrumentation/**/*.yaml
        - .trivyignore.yaml
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: *iac_paths

# ---------------------------------------------------------------------------
# Self-service onboarding (IaC Roadmap milestone, done - folded in from the
# now-retired observability-otel-demo-onboarding repo, see that milestone's
# entry for the full design/rationale). validate:manifests above
# (manifests/schema.json compliance) plus three "tenants"-stage jobs:
#   1. tenants:create-mr - a platform/application owner's request (via
#      form/index.html, published by the pages job below, or a direct
#      trigger-API call) becomes a new manifests/{platforms,applications}/
#      file and an MR - never merges anything itself, that's the
#      observability platform owner's job.
#   2. tenants:apply - on every push to main that touches manifests/
#      (i.e. once an onboarding MR is merged), reconciles every manifest
#      into this same checkout (scripts/provision.py) and commits the
#      result directly - no second MR, a human already reviewed the
#      manifest at merge time.
#   3. pages - publishes form/index.html as the self-service form. Also
#      in the "tenants" stage logically, but its job name must stay
#      exactly "pages" (GitLab convention, not a style choice) - the
#      stage-prefix naming below doesn't apply to it.
#   4. tenants:rollout (see the deploy-stage section below, moved
#      here from "deploy" now that this stage exists) - runs in the SAME
#      pipeline as tenants:apply (needs: + a matching changes: rule,
#      not a second commit-triggered pipeline), applying the exact files
#      tenants:apply just generated via its artifact, rolling the
#      provisioned change out to the live cluster.
# ---------------------------------------------------------------------------

# Required variable, set as a masked+protected CI/CD variable: a
# fine-grained Personal Access Token scoped to this project (Project
# Access Tokens are disabled for this namespace, no self-service toggle -
# a Personal Access Token is the practical substitute), permissions
# Branch (create, read), Commit (create, read, update), Merge Request
# (create, read, update). NOT CI_JOB_TOKEN - it reliably 404s on
# repository API endpoints (branches/commits) even for this same
# project, a long-standing, still-open GitLab platform limitation, not a
# settings issue. Also used by tenants:apply below to push past
# main's branch protection.
tenants:create-mr:
  stage: tenants
  image: python:3.15.2-slim
  script:
    - python3 -m venv .venv && . .venv/bin/activate && pip install --quiet --upgrade pip
    - pip install --quiet -r ci/requirements/onboarding.txt
    - python3 scripts/create-onboarding-mr.py
  rules:
    # $SYSTEM_ID guards against a run without the form's variables
    # reaching create-onboarding-mr.py at all - it exits 1 anyway in that
    # case, this just fails fast. Only ever started from the form (via
    # GitLab's "Run pipeline" page) or a manual web run.
    - if: '($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $SYSTEM_ID'

# Updates an already-onboarded system's owner/environments (e.g. a
# T-shirt size change) - see scripts/create-update-mr.py's own comment
# for why this is deliberately narrower than tenants:create-mr
# (system_id/type/name stay fixed identity, only owner/environments are
# replaced). Gated on $UPDATE_SYSTEM_ID specifically, a different
# variable than $SYSTEM_ID/$OFFBOARDING_SYSTEM_ID, so the form/a
# trigger call can only ever start one of these three jobs.
tenants:update-mr:
  stage: tenants
  image: python:3.15.2-slim
  script:
    - python3 -m venv .venv && . .venv/bin/activate && pip install --quiet --upgrade pip
    - pip install --quiet -r ci/requirements/onboarding.txt
    - python3 scripts/create-update-mr.py
  rules:
    - if: '($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $UPDATE_SYSTEM_ID'

# Reverse of tenants:create-mr above (self-service offboarding) -
# see scripts/create-offboarding-mr.py's own comment. Gated on
# $OFFBOARDING_SYSTEM_ID specifically, a different variable than
# $SYSTEM_ID above, so the form/a trigger call can only ever start one
# of these two jobs, never both/neither for the same call.
tenants:offboarding-mr:
  stage: tenants
  image: python:3.15.2-slim
  script:
    - python3 -m venv .venv && . .venv/bin/activate && pip install --quiet --upgrade pip
    - pip install --quiet -r ci/requirements/onboarding.txt
    - python3 scripts/create-offboarding-mr.py
  rules:
    - if: '($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $OFFBOARDING_SYSTEM_ID'

# Required variable, set as a CI/CD variable: GITLAB_API_TOKEN (see
# tenants:create-mr above) - also used here to push past main's branch
# protection. No trigger token here on purpose: an earlier version of
# this design had tenants:apply self-trigger a new pipeline (with a
# variable tenants:rollout' rules checked) to auto-run the rollout -
# found live during setup that this is a real vulnerability, not just
# an unused convenience: GitLab pipeline trigger tokens don't restrict
# which variables a caller may pass, only that they can start a
# pipeline at all - so anyone who read the public TRIGGER_TOKEN out of
# form/index.html's source could have called the trigger API directly
# with that same "deploy" variable set and rolled a real change out to
# the live cluster, with zero review. Fixed by keeping the rollout
# entirely off any trigger-sourced/variable-based path: tenants:rollout
# now runs via needs:/a same-pipeline changes: rule (see that job's own
# comment) - only this job, using the server-side-only GITLAB_API_TOKEN
# that never reaches a browser, can ever push a `manifests/**/*`-touching
# commit that makes both jobs run. The bot identity below still matters
# separately: destroy:*'s own rules check it to hide their manual
# buttons on this job's own follow-up push (see .destroy_fleet's
# comment).
tenants:apply:
  stage: tenants
  image: python:3.15.2-slim
  # Serializes this job and tenants:rollout across ALL pipelines
  # (GitLab's own mutual-exclusion primitive, Free tier) - merging
  # several onboarding MRs close together starts that many pipelines,
  # and their rollouts of the same shared tenant state must not
  # interleave.
  resource_group: tenants-provisioning
  variables:
    # Full history: PROVISIONED_ORDER below counts main's first-parent
    # commits, a shallow clone would cap that count.
    GIT_DEPTH: "0"
  before_script:
    - apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git ca-certificates >/dev/null
    - python3 -m venv .venv && . .venv/bin/activate && pip install --quiet --upgrade pip
    - pip install --quiet -r ci/requirements/onboarding.txt
  script:
    # Re-sync to the real, current main instead of this pipeline's
    # pinned commit (found live: `Checking out 5e2d13c9 as detached
    # HEAD`): with several merges in a burst, each queued pipeline's own
    # commit is increasingly stale, and rolling it out would undo the
    # tenants merged after it.
    - git fetch origin main
    - git checkout origin/main
    # Verify, don't commit: the generated files are committed in the
    # merge request together with the manifest change (scripts/
    # provisioning_sync.py, checked there by provision:check). Before,
    # this job ran provision.py and pushed the result to main with
    # GITLAB_API_TOKEN (`git push -o ci.skip`) - main was briefly
    # inconsistent after every merge, reviewers never saw the generated
    # changes, and the token needed push rights on main. Fail-closed if
    # main is still out of date (e.g. two MRs generated against the
    # same older main, merged back to back): the cluster never gets a
    # state that isn't in git. Fix: run `python3 scripts/provision.py`
    # on current main and merge that via an MR.
    - python3 scripts/provisioning_sync.py --check
    - git archive --format=tar.gz -o provisioned-main.tar.gz HEAD
    - echo "Verified main $(git rev-parse --short HEAD) - handed to tenants:rollout"
    # Commit identity for tenants:rollout's newest-wins guard (see there).
    - echo "PROVISIONED_SHA=$(git rev-parse HEAD)" > provisioned.env
    # Position on main's first-parent line: every merge to main adds one,
    # so a later main always has a higher value. Not the commit time -
    # second resolution, and not guaranteed monotonic.
    - echo "PROVISIONED_ORDER=$(git rev-list --count --first-parent HEAD)" >> provisioned.env
  # Hand-off to tenants:rollout in the SAME pipeline (see that job's
  # own needs:/rules): the complete tree of the main verified above,
  # not single files layered over rollout's own, possibly older
  # checkout - that left files deleted on main (an offboarded tenant's
  # dashboard/certs) in place for Terraform's fileset() to pick up, and
  # mixed newer data with older Terraform code. (Before, the list of
  # single files also had to track everything provision.py writes -
  # found live after a rebuild: tls-certs was missing, and the gateway
  # hung in Init.) expire_in kept short: same-pipeline relay only.
  artifacts:
    paths:
      - provisioned-main.tar.gz
    reports:
      dotenv: provisioned.env
    # Not just a same-pipeline relay: tenants:rollout can also be a
    # manual button (Terraform/alerting-only changes), clicked later.
    # The newest-wins guard keeps an old archive from being rolled out.
    expire_in: 1 week
  rules:
    - !reference [.skip_self_service_requests, rules]
    - if: '$CI_PIPELINE_SOURCE == "web"'
    # Generated files too, not only manifests: a recovery MR that only
    # regenerates them (after this job failed on an out-of-date main)
    # must roll out automatically as well. Same list as
    # tenants:rollout's automatic rule.
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - manifests/**/*
        - helm/values/*-tenant-overrides.yaml
        - helm/values/ingestion-daily-budgets.yaml
        - collector-gateway/otel-gateway-collector.yaml
        - instrumentation/platforms/4087-container-platform/config.yaml
        - rules/**/*
        - slo/**/*
        - services/**/*
        - datasources/**/*
        - dashboards/**/*
        - tls-certs/**/*
    # Also wherever tenants:rollout is only a manual button, so every
    # rollout gets a verified main and the newest-wins guard (a manual rollout
    # from its own checkout would bypass both).
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - terraform/environments/tenants/**/*
        - alerting/**/*
        # Same manual condition as tenants:rollout's, which needs: this job.
        - scripts/sync-mimir-rules.py

# GitLab Pages: publishes form/index.html as the self-service onboarding
# form. Job must be named "pages", artifact path must be "public" - both
# GitLab conventions, not arbitrary choices (see this stage's own
# top-of-file comment for why this one job doesn't get the usual
# "tenants:" prefix). Deploy > Pages in the project sets the access
# level (defaults to project-members-only, switch to "Everyone" if
# requesters without GitLab access need to reach it) and shows the
# current URL.
pages:
  stage: tenants
  image: alpine:3.24.4
  script:
    - mkdir -p public
    - cp form/index.html public/index.html
    - sed -i "s#__REPO_URL__#${CI_PROJECT_URL}#" public/index.html
  artifacts:
    paths:
      - public
  rules:
    - !reference [.skip_self_service_requests, rules]
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
