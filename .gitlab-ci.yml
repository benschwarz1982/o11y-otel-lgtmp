.deploy_fleet:
  stage: deploy-fleets
  # Never actually inherited unmodified - every real deploy-fleets:* job
  # either overrides image+before_script for a pure-Terraform
  # hashicorp/terraform image, or (4711/4722) overrides image for one of
  # the ci-tools/* images (see ci/images/Dockerfile) - kept as a valid,
  # sane default (kubectl/helm already baked into ci-tools/base) rather
  # than dead weight.
  image: $CI_REGISTRY_IMAGE/ci-tools/base:v1
  before_script:
    - !reference [.setup_kubeconfig, script]
  rules:
    - !reference [.skip_self_service_requests, rules]
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true
  environment:
    name: demo

