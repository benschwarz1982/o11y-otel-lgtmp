# --- applikationen tier: each needs its platform-basis tier job to have
# run. 4711/4722 below: Ansible over SSH/WinRM (IaC Roadmap milestone,
# same pattern as deploy-instrumentations:1286-linux-basis/-1229-windows-basis -
# see ansible/README.md), not shell/PowerShell + `az vm run-command` -
# both apps already run on the Terraform/Ansible-managed platform-basis
# VMs, so this is a config-only translation, no new VM provisioning. The
# `az network nsg rule create` call for the app's own port stays
# imperative CLI, not moved into Terraform/Ansible - see
# terraform/modules/client-vm's own base-access-rule comment for why. ---

deploy-fleets:4711-mitarbeiterverzeichnis:
  extends: .deploy_fleet
  # ci-tools/ansible-linux: terraform + ansible-core + openssh-client -
  # see ci/images/Dockerfile. Replaces .install_tools/.install_ssh/
  # .install_ansible (kept .setup_kubeconfig + .fix_ansible_cfg_perms
  # below - see that template's own comment for why it's still needed
  # per-job).
  image: $CI_REGISTRY_IMAGE/ci-tools/ansible-linux:v1
  needs:
    - job: deploy-fleets:1286-linux-basis
      optional: true
  before_script:
    - !reference [.setup_kubeconfig, script]
    - !reference [.fix_ansible_cfg_perms, script]
  script:
    - export ARM_CLIENT_ID="$AZURE_CLIENT_ID"
    - export ARM_CLIENT_SECRET="$AZURE_CLIENT_SECRET"
    - export ARM_TENANT_ID="$AZURE_TENANT_ID"
    - export ARM_SUBSCRIPTION_ID="$AZURE_SUBSCRIPTION_ID"
    - sh "$CI_PROJECT_DIR/ci/gitlab/http-backend-override.sh" terraform/environments/fleet-1286-linux-basis
    - >
      terraform -chdir=terraform/environments/fleet-1286-linux-basis init
      -backend-config="address=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/fleet-1286-linux-basis"
      -backend-config="lock_address=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/fleet-1286-linux-basis/lock"
      -backend-config="unlock_address=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/fleet-1286-linux-basis/lock"
      -backend-config="username=gitlab-ci-token"
      -backend-config="password=${CI_JOB_TOKEN}"
      -backend-config="lock_method=POST"
      -backend-config="unlock_method=DELETE"
      -backend-config="retry_wait_min=5"
    - terraform -chdir=terraform/environments/fleet-1286-linux-basis output -raw ssh_private_key > /tmp/vm-rocky-demo.pem
    - chmod 600 /tmp/vm-rocky-demo.pem
    - ROCKY_IP=$(terraform -chdir=terraform/environments/fleet-1286-linux-basis output -raw public_ip_address)
    - ROCKY_USER=$(terraform -chdir=terraform/environments/fleet-1286-linux-basis output -raw admin_username)
    # F08: pinned host key, read over the Azure control plane (modules/client-vm).
    - echo "$ROCKY_IP $(terraform -chdir=terraform/environments/fleet-1286-linux-basis output -raw ssh_host_public_key)" > /tmp/known_hosts
    - |
      cat > ansible/inventory/generated.ini << EOF
      [platform_linux]
      vm-rocky-demo ansible_host=$ROCKY_IP ansible_user=$ROCKY_USER ansible_ssh_private_key_file=/tmp/vm-rocky-demo.pem ansible_python_interpreter=/usr/bin/python3 ansible_ssh_common_args='-o StrictHostKeyChecking=yes -o UserKnownHostsFile=/tmp/known_hosts'

      [platform_windows]
      EOF
    - cd ansible
