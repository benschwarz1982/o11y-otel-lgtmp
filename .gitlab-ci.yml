  image:
    name: hashicorp/terraform:1.17.2
    entrypoint: [""]
  before_script: []
  needs:
    - job: deploy-fleets:4721-kundenverwaltung
      optional: true
  script:
    - !reference [.terraform_init_fleet_4139, script]
    - terraform apply -auto-approve -var instrument=true
  rules:
    - !reference [.skip_self_service_requests, rules]
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true
      changes:
        - terraform/environments/fleet-4139-postgresql/**/*
        - app/4721-kundenverwaltung/**/*
        - instrumentation/applications/4721-kundenverwaltung/**/*

deploy-instrumentations:4722-spesenabrechnung:
  extends: .instrument_fleet
  # ci-tools/ansible-windows - see ci/images/Dockerfile and
  # deploy-fleets:4722-spesenabrechnung's own comment on this image.
  image: $CI_REGISTRY_IMAGE/ci-tools/ansible-windows:v1
  needs:
    - job: deploy-fleets:4722-spesenabrechnung
      optional: true
  before_script:
    - !reference [.setup_kubeconfig, script]
    - !reference [.fix_ansible_cfg_perms, script]
  script:
    - export ARM_CLIENT_ID="$AZURE_CLIENT_ID"
    - export ARM_CLIENT_SECRET="$AZURE_CLIENT_SECRET"
    - export ARM_TENANT_ID="$AZURE_TENANT_ID"
    - export ARM_SUBSCRIPTION_ID="$AZURE_SUBSCRIPTION_ID"
    - sh "$CI_PROJECT_DIR/ci/gitlab/http-backend-override.sh" terraform/environments/fleet-1229-windows-basis
    - >
      terraform -chdir=terraform/environments/fleet-1229-windows-basis init
      -backend-config="address=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/fleet-1229-windows-basis"
      -backend-config="lock_address=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/fleet-1229-windows-basis/lock"
      -backend-config="unlock_address=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/fleet-1229-windows-basis/lock"
      -backend-config="username=gitlab-ci-token"
      -backend-config="password=${CI_JOB_TOKEN}"
      -backend-config="lock_method=POST"
      -backend-config="unlock_method=DELETE"
      -backend-config="retry_wait_min=5"
    - WINDOWS_IP=$(terraform -chdir=terraform/environments/fleet-1229-windows-basis output -raw public_ip_address)
    - WINDOWS_USER=$(terraform -chdir=terraform/environments/fleet-1229-windows-basis output -raw admin_username)
    - WINDOWS_PASS=$(terraform -chdir=terraform/environments/fleet-1229-windows-basis output -raw admin_password)
    # F08: pinned WinRM server certificate (modules/client-vm, pin-winrm-cert).
    - terraform -chdir=terraform/environments/fleet-1229-windows-basis output -raw winrm_server_cert_pem > /tmp/winrm-server.pem
    - !reference [.terraform_output_traefik_otlp_ip, script]
    - !reference [.terraform_output_pyroscope_ip, script]
    - |
      cat > ansible/inventory/generated.ini << EOF
      [platform_linux]

      [platform_windows]
      vm-windows-demo ansible_host=$WINDOWS_IP ansible_user=$WINDOWS_USER ansible_password=$WINDOWS_PASS ansible_connection=winrm ansible_winrm_transport=basic ansible_winrm_server_cert_validation=validate ansible_winrm_ca_trust_path=/tmp/winrm-server.pem ansible_port=5986
      EOF
    - cd ansible
    - export ANSIBLE_HOST_KEY_CHECKING=True
    - export ANSIBLE_ROLES_PATH="$(pwd)/roles"
    - ansible-playbook -i inventory/generated.ini playbooks/onboard-middleware-dotnet.yml --tags instrument -e "traefik_otlp_ip=$TRAEFIK_OTLP_IP pyroscope_internal_ip=$PYROSCOPE_IP tenant_id=4722-prod service_namespace=spesenabrechnung deployment_environment=prod app_owner='Platform Engineering' app_cost_center=CC-4722 app_size_class=S"
    - echo "4722 instrumented (exporting to tenant 4722-prod)"
  rules:
    - !reference [.skip_self_service_requests, rules]
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true
      changes:
        - ansible/roles/middleware-dotnet/**/*
        - ansible/roles/otlp_client_cert/**/*
        - ansible/playbooks/onboard-middleware-dotnet.yml
        - ansible/playbooks/group_vars/all.yml
        - instrumentation/middleware/dotnet/**/*

# ---------------------------------------------------------------------------
# demo stage - one break/fix job pair per Use Case in README.md's Demo
# Use Cases table (see docs/demo.md#runbook for the presenter steps),
# so each row's own alert (see alerting/README.md) can be forced and
# cleared live, independently, any time - same "always-available manual
# button, no changes: gate" idiom as .destroy_fleet below, since these
# are one-shot operational actions, not deployments reacting to a file
# change. Placed after tenants (not directly after deploy-
# instrumentations) - every alert queries a per-tenant datasource that
# only exists once tenants:rollout has actually run.
# ---------------------------------------------------------------------------

.demo_uc:
  stage: demo
  # ci-tools/base: kubectl + helm on top of the azure-cli image - see
  # ci/images/Dockerfile. None of the 5 UCs need terraform/ansible.
  image: $CI_REGISTRY_IMAGE/ci-tools/base:v1
  before_script:
    - !reference [.setup_kubeconfig, script]
  rules:
    - !reference [.skip_self_service_requests, rules]
    # Hidden on the onboarding MR-merge push itself - same changes:
    # filter tenants:apply/tenants:rollout use (see destroy:*'s own
    # rule/comment for the same pattern) - this only fires in exactly
    # the pipeline where those two are about to run, not on an
    # unrelated push to main.
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - manifests/**/*
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true
  environment:
    name: demo

# UC1 - Linux CPU Saturation: 2 CPU-spin loops on vm-rocky-demo (its 2
# vCPUs) via az vm run-command - plain bash, no package install
# (stress-ng/stress aren't on the VM and won't be added). The script
# is written to a local file first and passed as --scripts @file
# rather than inlined, so the remote script's own $-expansions
# ($!/$pid) aren't touched by this job's own shell/YAML parsing.
demo:uc1-break:
  extends: .demo_uc
  script:
    - |
      cat > /tmp/uc1-break.sh << 'EOF'
      rm -f /tmp/demo-uc1-cpu.pids
      for i in 1 2; do
        # nice -n 19 (lowest scheduling priority) - found live:
        # vm-rocky-demo is a Standard_B2s (2 vCPUs, burstable) - at
        # ~100% combined CPU from these two loops, a brand-new SSH
        # connection's handshake/fork (needed by OpenClaw's own
        # remediation over SSH, once per runbook step) intermittently
        # failed outright ("Command exited with code 255") rather than
        # just running slowly - the very fault being demonstrated was
        # degrading the channel meant to fix it. CPU usage (what the
        # alert measures) is unaffected by niceness - only scheduling
        # priority changes, so sshd/its forked shells now reliably get
        # CPU ahead of these two loops instead of competing evenly.
        nohup nice -n 19 bash -c 'while :; do :; done' >/dev/null 2>&1 &
        echo $! >> /tmp/demo-uc1-cpu.pids
      done
      echo "started:"; cat /tmp/demo-uc1-cpu.pids
      EOF
    - az vm run-command invoke -g "$AZURE_RESOURCE_GROUP" -n vm-rocky-demo --command-id RunShellScript --scripts @/tmp/uc1-break.sh
    - echo "2 CPU-spin loops started on vm-rocky-demo - '1286 Linux Basis - host CPU > 80%' should fire in ~1-2 min, see Grafana's Alerting page."

demo:uc1-fix:
  extends: .demo_uc
  script:
    - |
      cat > /tmp/uc1-fix.sh << 'EOF'
      # Matches the loop body directly (pkill -f) rather than trusting
      # /tmp/demo-uc1-cpu.pids alone - found live that a stale/mismatched
      # pidfile (root cause never fully pinned down, plausibly a race
      # between overlapping `az vm run-command` invocations while this
      # same session was separately fighting a full-disk RunCommand
      # extension wedge) let `kill "$pid" || true` silently do nothing
      # while this job still printed "stopped" - the loops kept running,
      # unnoticed, until caught by chance via a manual `top` check.
      if [ -f /tmp/demo-uc1-cpu.pids ]; then
        while read -r pid; do kill "$pid" 2>/dev/null || true; done < /tmp/demo-uc1-cpu.pids
        rm -f /tmp/demo-uc1-cpu.pids
      fi
      pkill -f 'while :; do :; done' 2>/dev/null || true
      sleep 1
      if pgrep -f 'while :; do :; done' >/dev/null; then
        echo "WARNING: a CPU-spin loop is still running after kill attempts"
        pgrep -af 'while :; do :; done'
        exit 1
      fi
      echo "stopped - verified no CPU-spin loop remains"
      EOF
    - az vm run-command invoke -g "$AZURE_RESOURCE_GROUP" -n vm-rocky-demo --command-id RunShellScript --scripts @/tmp/uc1-fix.sh
    - echo "CPU-spin loops killed. Alert clears on its next evaluation (~1 min)."

# UC2 - Windows Service Crash: a detached background loop on
# vm-windows-demo (1229) repeatedly kills the Print Spooler service's
# process every 30s, for as long as the loop runs - replaces the
# earlier UC2 (4721 Kundenverwaltung, Postgres connection usage),
# found live to read too similarly to UC1 (also a platform, also
# metrics-only); this one is a Logs signal instead, see
# alerting/platforms/1229-windows-server-basis/alert-rules.yaml's own
# header comment for the full history.
#
# A single kill (an earlier version of this job) self-heals within ~5s
# (this VM's default Spooler recovery policy is "RESTART, 5000ms x2")
# and only ever logs one pair of Error events - found live that made
# the alert's state reflect "an error happened recently" rather than
# "is this actually still broken", clearing on its own after the
# query's lookback window passed regardless of whether demo:uc2-fix
# ever ran. Repeatedly re-killing the service every time it restarts
# keeps genuine Error events (7031 "terminated unexpectedly") flowing
# for as long as the underlying problem (this loop) persists -
# confirmed live over several cycles - so the alert now tracks real
# state, not a one-off burst. Detached via Start-Process (like UC1's
# own nohup pattern on Linux), not a registered Scheduled Task -
# simpler, and avoids installing anything persistent at the OS level.
demo:uc2-break:
  extends: .demo_uc
  script:
    - |
      cat > /tmp/uc2-break.ps1 << 'EOF'
      # Found live: Spooler's own default recovery policy only lists
      # 2 restart actions before falling back to "take no action", and
      # its failure counter only resets after 3600s (1h) of healthy
      # running - both far too generous for this loop's own 30s kill
      # interval. The counter never got a chance to reset between
      # kills, so by the 3rd kill (~60-90s in) it exceeded the
      # configured action count and Windows stopped restarting the
      # service for good - the loop below only ever targets a
      # *Running* instance, so once the service stayed Stopped, no
      # further Error events were ever generated, and the alert aged
      # out of its own lookback window on its own, regardless of
      # whether demo:uc2-fix ever ran - exactly the failure mode this
      # rule's own alert-rules.yaml comment says this approach was
      # supposed to avoid. reset= 20 (less than the 30s kill interval)
      # guarantees the counter is always back to zero before the next
      # kill, so every single kill is perpetually treated as "the
      # first failure" and restarts every time, for as long as this
      # loop keeps running.
      sc.exe failure Spooler reset= 20 actions= restart/5000
      $loopScript = @'
      while ($true) {
        Get-CimInstance Win32_Service | Where-Object { $_.Name -eq "Spooler" -and $_.State -eq "Running" } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force }
        Start-Sleep -Seconds 30
      }
      '@
      Set-Content -Path C:\demo-uc2-kill-loop.ps1 -Value $loopScript
      Start-Process -FilePath "powershell.exe" -ArgumentList "-NoProfile -WindowStyle Hidden -ExecutionPolicy Bypass -File C:\demo-uc2-kill-loop.ps1" -WindowStyle Hidden
      EOF
    - az vm run-command invoke -g "$AZURE_RESOURCE_GROUP" -n vm-windows-demo --command-id RunPowerShellScript --scripts @/tmp/uc2-break.ps1
    - echo "Print Spooler crash loop started (kills it every 30s) - '1229 Windows Server Basis - Print Spooler service crashed' should fire in ~1-2 min, see Grafana's Alerting page."

demo:uc2-fix:
  extends: .demo_uc
  script:
    - |
      cat > /tmp/uc2-fix.ps1 << 'EOF'
      Get-CimInstance Win32_Process -Filter "Name='powershell.exe'" | Where-Object { $_.CommandLine -like '*demo-uc2-kill-loop.ps1*' } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force }
      Remove-Item -Path C:\demo-uc2-kill-loop.ps1 -ErrorAction SilentlyContinue
      EOF
    - az vm run-command invoke -g "$AZURE_RESOURCE_GROUP" -n vm-windows-demo --command-id RunPowerShellScript --scripts @/tmp/uc2-fix.ps1
    - echo "Crash loop stopped - Print Spooler stabilizes (its own recovery policy was never touched). Alert clears once no new errors appear within its lookback window (~2 min)."

# UC3 - Kubernetes Microservices: flips the Astronomy Shop chart's own
# flagd feature flag intlShippingSlowdown (its own official fault-
# injection mechanism, not something this repo builds) by rewriting
# the flagd-config ConfigMap's JSON and re-applying it. Found live:
# despite flagd's own fsnotify file watcher, this deployment's flagd
# pod does NOT actually pick up a ConfigMap content change on its
# own (confirmed via its OFREP evaluation API staying on the old
# variant for minutes) - its config volume is named "config-rw", most
# likely seeded once at pod start rather than a live ConfigMap mount,
# so a rollout restart is required after every patch. Verified live
# both directions (break and fix) - the flag only actually changes
# after the restart completes.
demo:uc3-break:
  extends: .demo_uc
  script:
    - |
      kubectl get configmap flagd-config -n astronomy-shop -o jsonpath='{.data.demo\.flagd\.json}' > /tmp/flagd.json
      python3 -c "
      import json
      with open('/tmp/flagd.json') as f:
          d = json.load(f)
      d['flags']['intlShippingSlowdown']['defaultVariant'] = '5sec'
      with open('/tmp/flagd.json', 'w') as f:
          json.dump(d, f)
      "
      kubectl create configmap flagd-config -n astronomy-shop --from-file=demo.flagd.json=/tmp/flagd.json --dry-run=client -o yaml | kubectl apply -f -
    - kubectl rollout restart deployment flagd -n astronomy-shop
    - kubectl rollout status deployment flagd -n astronomy-shop --timeout=60s
    - echo "flagd intlShippingSlowdown flipped to 5sec - '4720 OTel Astronomy Shop Demo - p95 latency high' should fire in ~1-2 min."

demo:uc3-fix:
  extends: .demo_uc
  script:
    - |
      kubectl get configmap flagd-config -n astronomy-shop -o jsonpath='{.data.demo\.flagd\.json}' > /tmp/flagd.json
      python3 -c "
      import json
      with open('/tmp/flagd.json') as f:
          d = json.load(f)
      d['flags']['intlShippingSlowdown']['defaultVariant'] = 'off'
      with open('/tmp/flagd.json', 'w') as f:
          json.dump(d, f)
      "
      kubectl create configmap flagd-config -n astronomy-shop --from-file=demo.flagd.json=/tmp/flagd.json --dry-run=client -o yaml | kubectl apply -f -
    - kubectl rollout restart deployment flagd -n astronomy-shop
    - kubectl rollout status deployment flagd -n astronomy-shop --timeout=60s
    - echo "flagd intlShippingSlowdown flipped back to off. Latency normalizes once the restart completes; the alert clears on its next evaluation."

# UC4 - Multi-Tenancy: Ingestion Budget Enforcement (previously UC5;
# moved up when the old UC4/Object Storage Usage was dropped outright,
# no replacement - see alerting/README.md and README.md's Demo Use
# Cases; 4015 stays onboarded, it just has no alert/Use Case of its
# own anymore, and its own break/fix jobs were removed with it).
#
# Rewritten for the rate-limit/daily-budget decoupling redesign (see
# scripts/provision.py's compute_overrides() and scripts/ingestion-
# midnight-snapshot.py) - the original version here hammered
# Spesenabrechnung's (4722) HTTP endpoint for ~90 seconds, back when
# every tenant's per-second rate limit was tied to its own size tier,
# making the fastest possible fill time a fixed ~4.8h regardless of
# size (found live - not fixable by hammering harder or resizing). Now
# that the per-second limit is generic and decoupled from a tenant's
# own (still size-derived) daily budget, a small tenant's small budget
# fills in well under two minutes at a sustained push - see
# scripts/demo-uc4-flood.py's own docstring for the full rationale and
# why Loki specifically. Demo tenant moved from 4722 to 4711
# (Mitarbeiterverzeichnis, S-tier, 1 GiB/day - see README.md's Demo Use
# Cases) in an earlier commit; this is the first time its
# own break/fix jobs actually reflect that.
demo:uc4-break:
  extends: .demo_uc
  script:
    - kubectl -n observability port-forward svc/loki-gateway 3100:80 > /dev/null 2>&1 &
    - PF_PID=$!
    - sleep 3
    - echo "Flooding Mitarbeiterverzeichnis's (4711-prod) Loki ingestion for ~2.5 minutes to push it over its daily budget..."
    - python3 scripts/demo-uc4-flood.py
    - kill $PF_PID
    - echo "Flood complete. The daily-budget enforcer only checks every 2 minutes (not a real-time gate like the per-second rate limit is - found live, some overshoot past 100% before it catches up is expected), so allow up to ~2 more minutes for 'Tenant ingestion budget exhausted (>100% of daily budget)' to fire for 4711-prod and for its rate/burst limit to actually be throttled to near-zero on all four systems - see the Operator dashboard."

# Runs scripts/ingestion-midnight-snapshot.py's --reset-tenant mode as a
# one-off in-cluster Job (not from this runner directly - that mode
# needs the ingestion-budget-enforcer ServiceAccount's in-cluster API
# access, the same way the CronJob itself runs) to un-throttle
# 4711-prod if throttled and reset its own midnight snapshot to right
# now, without waiting for a real midnight rollover or touching any
# other tenant.
demo:uc4-fix:
  extends: .demo_uc
  script:
    - |
      cat > /tmp/uc4-fix-job.yaml << 'EOF'
      apiVersion: batch/v1
      kind: Job
      metadata:
        generateName: demo-uc4-fix-
        namespace: observability
      spec:
        backoffLimit: 0
        template:
          metadata:
            annotations:
              # Unmeshed, same as the CronJob it shares its script with
              # (see that CronJob's own comment in
              # terraform/environments/observability-stack/main.tf) -
              # otherwise the Linkerd sidecar keeps this Job from ever
              # completing and the wait below times out.
              linkerd.io/inject: disabled
          spec:
            restartPolicy: Never
            serviceAccountName: ingestion-budget-enforcer
            containers:
              - name: reset
                image: python:3.15.2-slim
                command: ["python3", "/scripts/snapshot.py", "--reset-tenant", "4711-prod"]
                volumeMounts:
                  - name: script
                    mountPath: /scripts
                  - name: budgets
                    mountPath: /budgets
            volumes:
              - name: script
                configMap:
                  name: ingestion-midnight-snapshot-script
              - name: budgets
                configMap:
                  name: tenant-ingestion-budgets
      EOF
      JOB_NAME=$(kubectl create -f /tmp/uc4-fix-job.yaml -o jsonpath='{.metadata.name}')
      kubectl -n observability wait --for=condition=complete "job/${JOB_NAME}" --timeout=60s
      kubectl -n observability logs "job/${JOB_NAME}"
      kubectl -n observability delete job "${JOB_NAME}"
    - echo "4711-prod un-throttled (if it was) and its daily usage reset to 0% for the rest of today - see the log above. The alert clears on its next evaluation."

# ---------------------------------------------------------------------------
# destroy stage - mirrors deploy, in reverse order. The six destroy:*
# fleet-teardown jobs below are independent/freely runnable; no changes:
# filter on any destroy:* job on purpose - tearing something down isn't
# tied to what changed in a given push, it should stay a manual safety
# valve available on any pipeline (except two narrow exclusions: an
# onboarding MR-merge push, and tenants:apply's own follow-up push -
# see .destroy_fleet's own rules/comment). destroy:observability-stack
# and destroy:infra depend on the fleet jobs via `needs:` - see the
# top-of-file comment for why.
# ---------------------------------------------------------------------------

.destroy_fleet:
  stage: destroy
  # Never actually inherited unmodified - same story as .deploy_fleet
  # above (every real destroy:* job that extends this overrides image to
  # the pure-Terraform hashicorp/terraform image). Kept as a sane
  # default.
  image: $CI_REGISTRY_IMAGE/ci-tools/base:v1
  before_script:
    - !reference [.setup_kubeconfig, script]
  rules:
    - !reference [.skip_self_service_requests, rules]
    # Hidden on the onboarding MR-merge push itself - same changes:
    # filter tenants:apply/tenants:rollout use, so this only
    # fires in exactly the pipeline where those two are about to run.
    # A genuine human/infra push that doesn't touch manifests/**/*
    # falls through to the rule below unaffected.
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - manifests/**/*
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true

# Coarser-grained than the deploy-fleets:* tier split on purpose:
# deleting a VM or a namespace already takes every tier staged on top
# of it down in one step (destroy:1286-linux-basis also covers 4711,
# destroy:1229-windows-basis also covers 4722) - splitting destroy jobs
# to match deploy's finer granularity would just be redundant work
# against resources already gone.

# Both below: pure Terraform (terraform destroy tears down the VM, NIC,
# Public IP, NSG+rule, and OS disk together, same as the old scripts did
# by hand) - see deploy-fleets:1286-linux-basis/deploy-fleets:1229-windows-basis's
# own comment on why these override .destroy_fleet's image/before_script.
destroy:aiops:
  stage: destroy
  image:
    name: hashicorp/terraform:1.17.2
    entrypoint: [""]
  rules:
    - !reference [.skip_self_service_requests, rules]
    # Hidden on the onboarding MR-merge push itself - same changes:
    # filter tenants:apply/tenants:rollout use, so this only
    # fires in exactly the pipeline where those two are about to run.
    # A genuine human/infra push that doesn't touch manifests/**/*
    # falls through to the rule below unaffected.
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - manifests/**/*
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true
  script:
    - !reference [.confirm_destroy, script]
    - !reference [.terraform_init_aiops, script]
    - terraform destroy -auto-approve

destroy:1286-linux-basis:
  stage: destroy
  image:
    name: hashicorp/terraform:1.17.2
    entrypoint: [""]
  rules:
    - !reference [.skip_self_service_requests, rules]
    # Hidden on the onboarding MR-merge push itself - same changes:
    # filter tenants:apply/tenants:rollout use, so this only
    # fires in exactly the pipeline where those two are about to run.
    # A genuine human/infra push that doesn't touch manifests/**/*
    # falls through to the rule below unaffected.
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - manifests/**/*
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true
  script:
    - !reference [.confirm_destroy, script]
    - !reference [.terraform_init_fleet_1286, script]
    - terraform destroy -auto-approve

destroy:1229-windows-basis:
  stage: destroy
  image:
    name: hashicorp/terraform:1.17.2
    entrypoint: [""]
  rules:
    - !reference [.skip_self_service_requests, rules]
    # Hidden on the onboarding MR-merge push itself - same changes:
    # filter tenants:apply/tenants:rollout use, so this only
    # fires in exactly the pipeline where those two are about to run.
    # A genuine human/infra push that doesn't touch manifests/**/*
    # falls through to the rule below unaffected.
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - manifests/**/*
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true
  script:
    - !reference [.confirm_destroy, script]
