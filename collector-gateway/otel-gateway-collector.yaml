---
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-gateway
  namespace: observability
spec:
  mode: deployment
  replicas: 2
  image: otel/opentelemetry-collector-contrib:0.166.0
  # F03: the shared OTLP ports bypass linkerd's inbound proxy, so
  # the gateway sees the real client pod IP (k8sattributes/source below).
  # Through the proxy every connection came from the gateway itself
  # (found live: tenant data tagged with the gateway's own pod name).
  # Note: the operator does not remove an annotation from the Deployment
  # when it is dropped here - remove it there by hand if ever reverted.
  podAnnotations:
    config.linkerd.io/skip-inbound-ports: "4317,4318"
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  ports:
    - name: otlp-grpc
      port: 4317
    - name: otlp-http
      port: 4318
    - name: p21229
      port: 21229
    - name: p21286
      port: 21286
    - name: p21294
      port: 21294
    - name: p24015
      port: 24015
    - name: p24087
      port: 24087
    - name: p24711
      port: 24711
    - name: p24720
      port: 24720
    - name: p24721
      port: 24721
    - name: p24722
      port: 24722
  config:
    extensions:
      # Multi-tenancy for the onboarding process (see
      # observability-otel-demo-onboarding repo): each client sets its own
      # "tenant_id" header/metadata on its OTLP export (its system_id from
      # the onboarding manifest) - this extension forwards whatever value
      # it finds as X-Scope-OrgID to Mimir/Loki/Tempo, which natively
      # isolate data per X-Scope-OrgID. New systems need zero changes here
      # - only the client sets its own header. Anything that doesn't set
      # tenant_id (self-scraped collector metrics, traffic from before
      # this was introduced) falls back to "anonymous", preserving today's
      # behavior.
      headers_setter:
        headers:
          - action: insert
            key: X-Scope-OrgID
            from_context: tenant_id
            default_value: anonymous

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
            include_metadata: true
          http:
            endpoint: 0.0.0.0:4318
            include_metadata: true
      syslog:
        protocol: rfc5424
        tcp:
          listen_address: 0.0.0.0:5514

      # Self-scrape of the collector's own internal metrics (:8888/metrics),
      # needed for the "OpenTelemetry Collector" self-monitoring dashboard -
      # see otel-agent-daemonset.yaml for the same pattern on the agent side.
      prometheus/self:
        config:
          scrape_configs:
            - job_name: otelcol
              scrape_interval: 30s
              static_configs:
                - targets: ["localhost:8888"]

      # Scrape of Mimir's own operational metrics (cortex_discarded_*,
      # cortex_limits_overrides) from its distributor and overrides_exporter
      # components' :8080/metrics endpoints. Mimir does not ingest these
      # into its own queryable per-tenant storage on its own - same
      # self-scrape-and-remote-write pattern as prometheus/self above, so
      # the shared operator budget dashboard can query them via PromQL
      # instead of parsing a raw scrape endpoint. Lands under the
      # "anonymous" tenant like all self-monitoring data (see
      # headers_setter's default_value above) - queried via the
      # Mimir-anonymous datasource, not the per-tenant ones.
      prometheus/mimir-self:
        config:
          scrape_configs:
            - job_name: mimir
              scrape_interval: 30s
              static_configs:
                - targets:
                    - "mimir-distributor.observability.svc:8080"
                    - "mimir-overrides-exporter.observability.svc:8080"

      # Same self-scrape-and-remote-write pattern as prometheus/mimir-self
      # above, extended to Loki/Tempo/Pyroscope once each of them also got
      # a real per-tenant ingestion budget (see helm/values/
      # loki-tenant-overrides.yaml, tempo-tenant-overrides.yaml,
      # pyroscope-tenant-overrides.yaml) - none of these three exposed
      # their own ingestion/discard metrics under a queryable Mimir tenant
      # on their own, same gap Mimir itself would have had without
      # prometheus/mimir-self. Confirmed live (this session) each of these
      # three endpoints actually exposes the relevant metrics before
      # wiring them in: loki_discarded_samples_total/loki_distributor_bytes_received_total
      # (loki-distributor:3100/metrics), tempo_discarded_spans_total/
      # tempo_distributor_bytes_received_total (tempo-distributor:3200/metrics),
      # pyroscope_distributor_received_compressed_bytes_sum
      # (pyroscope-distributor:4040/metrics).
      prometheus/loki-self:
        config:
          scrape_configs:
            - job_name: loki
              scrape_interval: 30s
              static_configs:
                - targets:
                    - "loki-distributor.observability.svc:3100"
      prometheus/tempo-self:
        config:
          scrape_configs:
            - job_name: tempo
              scrape_interval: 30s
              static_configs:
                - targets:
                    - "tempo-distributor.observability.svc:3200"
      prometheus/pyroscope-self:
        config:
          scrape_configs:
            - job_name: pyroscope
              scrape_interval: 30s
              static_configs:
                - targets:
                    - "pyroscope-distributor.observability.svc:4040"

      otlp/tenant-1229-prod:
        protocols:
          grpc:
            endpoint: 0.0.0.0:21229
            tls:
              cert_file: /etc/otel-gateway-tls/server/tls.crt
              key_file: /etc/otel-gateway-tls/server/tls.key
              client_ca_file: /etc/otel-gateway-tls/tenant-ca-1229-prod/tls.crt
              reload_interval: 1h
              client_ca_file_reload: true
            include_metadata: true
            keepalive:
              enforcement_policy:
                min_time: 10s
                permit_without_stream: true
      otlp/tenant-1286-prod:
        protocols:
          grpc:
            endpoint: 0.0.0.0:21286
            tls:
              cert_file: /etc/otel-gateway-tls/server/tls.crt
              key_file: /etc/otel-gateway-tls/server/tls.key
              client_ca_file: /etc/otel-gateway-tls/tenant-ca-1286-prod/tls.crt
              reload_interval: 1h
              client_ca_file_reload: true
            include_metadata: true
            keepalive:
              enforcement_policy:
                min_time: 10s
                permit_without_stream: true
      otlp/tenant-1294-prod:
        protocols:
          grpc:
            endpoint: 0.0.0.0:21294
            tls:
              cert_file: /etc/otel-gateway-tls/server/tls.crt
              key_file: /etc/otel-gateway-tls/server/tls.key
              client_ca_file: /etc/otel-gateway-tls/tenant-ca-1294-prod/tls.crt
              reload_interval: 1h
              client_ca_file_reload: true
            include_metadata: true
            keepalive:
              enforcement_policy:
                min_time: 10s
                permit_without_stream: true
      otlp/tenant-4015-prod:
        protocols:
          grpc:
            endpoint: 0.0.0.0:24015
            tls:
              cert_file: /etc/otel-gateway-tls/server/tls.crt
              key_file: /etc/otel-gateway-tls/server/tls.key
              client_ca_file: /etc/otel-gateway-tls/tenant-ca-4015-prod/tls.crt
              reload_interval: 1h
              client_ca_file_reload: true
            include_metadata: true
            keepalive:
              enforcement_policy:
                min_time: 10s
                permit_without_stream: true
      otlp/tenant-4087-prod:
        protocols:
          grpc:
            endpoint: 0.0.0.0:24087
            tls:
              cert_file: /etc/otel-gateway-tls/server/tls.crt
              key_file: /etc/otel-gateway-tls/server/tls.key
              client_ca_file: /etc/otel-gateway-tls/tenant-ca-4087-prod/tls.crt
              reload_interval: 1h
              client_ca_file_reload: true
            include_metadata: true
            keepalive:
              enforcement_policy:
                min_time: 10s
                permit_without_stream: true
      otlp/tenant-4711-prod:
        protocols:
          grpc:
            endpoint: 0.0.0.0:24711
            tls:
              cert_file: /etc/otel-gateway-tls/server/tls.crt
              key_file: /etc/otel-gateway-tls/server/tls.key
              client_ca_file: /etc/otel-gateway-tls/tenant-ca-4711-prod/tls.crt
              reload_interval: 1h
              client_ca_file_reload: true
            include_metadata: true
            keepalive:
              enforcement_policy:
                min_time: 10s
                permit_without_stream: true
      otlp/tenant-4720-prod:
        protocols:
          grpc:
            endpoint: 0.0.0.0:24720
            tls:
              cert_file: /etc/otel-gateway-tls/server/tls.crt
              key_file: /etc/otel-gateway-tls/server/tls.key
              client_ca_file: /etc/otel-gateway-tls/tenant-ca-4720-prod/tls.crt
              reload_interval: 1h
              client_ca_file_reload: true
            include_metadata: true
            keepalive:
              enforcement_policy:
                min_time: 10s
                permit_without_stream: true
      otlp/tenant-4721-prod:
        protocols:
          grpc:
            endpoint: 0.0.0.0:24721
            tls:
              cert_file: /etc/otel-gateway-tls/server/tls.crt
              key_file: /etc/otel-gateway-tls/server/tls.key
              client_ca_file: /etc/otel-gateway-tls/tenant-ca-4721-prod/tls.crt
              reload_interval: 1h
              client_ca_file_reload: true
            include_metadata: true
            keepalive:
              enforcement_policy:
                min_time: 10s
                permit_without_stream: true
      otlp/tenant-4722-prod:
        protocols:
          grpc:
            endpoint: 0.0.0.0:24722
            tls:
              cert_file: /etc/otel-gateway-tls/server/tls.crt
              key_file: /etc/otel-gateway-tls/server/tls.key
              client_ca_file: /etc/otel-gateway-tls/tenant-ca-4722-prod/tls.crt
              reload_interval: 1h
              client_ca_file_reload: true
            include_metadata: true
            keepalive:
              enforcement_policy:
                min_time: 10s
                permit_without_stream: true
    processors:
      batch:
        send_batch_size: 8192
        timeout: 5s
        # Without this, the batch processor merges requests from
        # different clients together and the per-request tenant_id
        # context (see the headers_setter extension above) is lost
        # before it reaches the exporters.
        metadata_keys: [tenant_id]
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 25
      resourcedetection:
        detectors: [env, system]
      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        extract:
          metadata:
            - k8s.pod.name
            - k8s.namespace.name
            - k8s.node.name
            - k8s.deployment.name

      # F03: identifies the sending pod's namespace from the connection's
      # source IP only - never from resource attributes a client could
      # set (k8s.pod.ip/uid, which the enrichment processor above also
      # accepts). k8sattributes doesn't overwrite an existing attribute,
      # so resource/strip_source_namespace deletes any client-sent value
      # first. routing/* (generated by scripts/provision.py) routes on it.
      k8sattributes/source:
        auth_type: serviceAccount
        passthrough: false
        pod_association:
          - sources:
              - from: connection
        extract:
          metadata: []
          labels:
            - tag_name: gateway.source_namespace
              key: kubernetes.io/metadata.name
              from: namespace

      resource/strip_source_namespace:
        attributes:
          - key: gateway.source_namespace
            action: delete

      # NOT CURRENTLY WIRED INTO ANY PIPELINE (see service.pipelines
      # below) - defined but inert until verified live again. Meant to
      # enforce real multi-tenancy: headers_setter above forwards
      # whatever tenant_id a client sets, unvalidated - Mimir/Loki create
      # a tenant implicitly on first write, no pre-registration needed,
      # so an instrumented-but-not-yet-onboarded system's telemetry would
      # otherwise be silently accepted (just invisible, no dashboard).
      # This processor copies the client-set tenant_id gRPC metadata
      # into a per-signal attribute (span attribute for traces, log
      # record attribute for logs, datapoint attribute for metrics) so
      # filter/reject_unknown_tenants below can act on it.
      #
      # Root-caused the two outages this caused earlier: the
      # attributesprocessor operates on per-signal attributes, never on
      # resource attributes ("The attributes processor modifies
      # attributes of a span, log, or metric" - for metrics specifically
      # at the datapoint level, confirmed via the processor's own
      # README) - the filter below was checking
      # resource.attributes["tenant_id"], which this processor never
      # populated, so every item hit the "== nil" branch and got
      # dropped. Fixed by checking attributes["tenant_id"] (the span/
      # log_record/datapoint's own attribute map) instead of
      # resource.attributes[...] - matches where this processor actually
      # writes.
      # action: upsert, not insert - insert only adds an attribute if
      # it doesn't already exist, so a span/log_record/datapoint that
      # (for whatever reason, e.g. a prior processor or an unusual
      # client) already carries a tenant_id attribute would keep that
      # stale value instead of being overwritten by the request's own
      # metadata, which is always the source of truth here. Hardened
      # defensively even though no current pipeline stage sets this
      # attribute earlier - insert's silent no-op-if-present behavior
      # is an easy trap to reintroduce unnoticed in a future change.
      attributes/tag_tenant:
        actions:
          - key: tenant_id
            action: upsert
            from_context: metadata.tenant_id

      # Drops telemetry for any tenant_id not in the allowlist below -
      # "anonymous" (self-monitoring, see headers_setter's default_value)
      # is always allowed; every other entry is a real onboarded
      # tenant_id from manifests/.
      # Auto-generated by scripts/provision.py from manifests/ - do not
      # hand-edit, overwritten on the next onboarding merge. Change the
      # allowlist by onboarding/offboarding a system instead.
      filter/reject_unknown_tenants:
        error_mode: ignore
        traces:
          span:
            - 'attributes["tenant_id"] == nil or not IsMatch(attributes["tenant_id"], "^(1229-prod|1286-prod|1294-prod|4015-prod|4087-prod|4711-prod|4720-prod|4721-prod|4722-prod|anonymous)$")'
        metrics:
          datapoint:
            - 'attributes["tenant_id"] == nil or not IsMatch(attributes["tenant_id"], "^(1229-prod|1286-prod|1294-prod|4015-prod|4087-prod|4711-prod|4720-prod|4721-prod|4722-prod|anonymous)$")'
        logs:
          log_record:
            - 'attributes["tenant_id"] == nil or not IsMatch(attributes["tenant_id"], "^(1229-prod|1286-prod|1294-prod|4015-prod|4087-prod|4711-prod|4720-prod|4721-prod|4722-prod|anonymous)$")'

      # instrumentation/schema/core.yaml's Cardinality Rule: attributes in the
      # "never as a metric label" tier must not survive into Mimir via
      # prometheusremotewrite's resource_to_telemetry_conversion below
      # - deleted here, metrics pipeline only, so they still reach
      # Tempo/Loki as real trace/log attributes on their own pipelines.
      # correlation.request_id is genuinely emitted now (Kundenverwaltung/
      # Spesenabrechnung set it as a span attribute per request - see
      # instrumentation/schema/core.yaml's Baggage Schema section), so this
      # guardrail is real, not theoretical, for that key - it was added
      # ahead of that happening rather than bolted on reactively like the
      # "processes" scraper fix was (see Known Pitfalls). correlation.
      # transaction_id is only ever set on the OTel Astronomy Shop Demo
      # (scripts/trigger-uc3-transaction.py), and even there only if the
      # upstream chart's own SDKs happen to copy it onto attributes -
      # unverified either way, see that script's own docstring.
      # F21: a transform processor, not a resource processor - an SDK can
      # also put these keys on the data points themselves, which a
      # resource processor never touches (each request would still create
      # a new Mimir series). Removes them from resource and data point
      # attributes (sum/gauge/histogram/exp. histogram/summary alike).
      transform/strip_high_cardinality_metrics:
        error_mode: ignore
        metric_statements:
          - delete_key(resource.attributes, "correlation.transaction_id")
          - delete_key(resource.attributes, "correlation.request_id")
          - delete_key(datapoint.attributes, "correlation.transaction_id")
          - delete_key(datapoint.attributes, "correlation.request_id")

      transform/redact:
        error_mode: ignore
        log_statements:
          - context: log
            statements:
              - delete_matching_keys(body, "(?i)(^|[._-])(password|passwd|pwd|secret|client[_-]?secret|api[_-]?key|apikey|access[_-]?token|refresh[_-]?token|token|authorization|cookie|set[_-]?cookie|cvv|cvc|card[_-]?number)$$") where IsMap(body)
              - delete_matching_keys(attributes, "(?i)(^|[._-])(password|passwd|pwd|secret|client[_-]?secret|api[_-]?key|apikey|access[_-]?token|refresh[_-]?token|token|authorization|cookie|set[_-]?cookie|cvv|cvc|card[_-]?number)$$")
              - replace_pattern(body, "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}", "<redacted:email>") where IsString(body)
              - replace_all_patterns(body, "value", "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}", "<redacted:email>") where IsMap(body)
              - 'replace_pattern(body, "\\b[A-Z]{2}[0-9]{2}(?: ?[A-Z0-9]{4}){3,7}(?: ?[A-Z0-9]{1,3})?\\b", "<redacted:iban>") where IsString(body)'
              - 'replace_all_patterns(body, "value", "\\b[A-Z]{2}[0-9]{2}(?: ?[A-Z0-9]{4}){3,7}(?: ?[A-Z0-9]{1,3})?\\b", "<redacted:iban>") where IsMap(body)'
              - replace_pattern(body, "\\b756\\.?[0-9]{4}\\.?[0-9]{4}\\.?[0-9]{2}\\b", "<redacted:ahv>") where IsString(body)
              - replace_all_patterns(body, "value", "\\b756\\.?[0-9]{4}\\.?[0-9]{4}\\.?[0-9]{2}\\b", "<redacted:ahv>") where IsMap(body)
              - replace_pattern(body, "\\b(?:4[0-9]{3}|5[1-5][0-9]{2}|2[2-7][0-9]{2})(?:[ -]?[0-9]{4}){3}\\b", "<redacted:card>") where IsString(body)
              - replace_all_patterns(body, "value", "\\b(?:4[0-9]{3}|5[1-5][0-9]{2}|2[2-7][0-9]{2})(?:[ -]?[0-9]{4}){3}\\b", "<redacted:card>") where IsMap(body)
              - replace_pattern(body, "\\b3[47][0-9]{2}[ -]?[0-9]{6}[ -]?[0-9]{5}\\b", "<redacted:card>") where IsString(body)
              - replace_all_patterns(body, "value", "\\b3[47][0-9]{2}[ -]?[0-9]{6}[ -]?[0-9]{5}\\b", "<redacted:card>") where IsMap(body)
              - replace_pattern(body, "(?i)(bearer\\s+)[A-Za-z0-9._~+/=-]{8,}", "$$1<redacted:token>") where IsString(body)
              - replace_all_patterns(body, "value", "(?i)(bearer\\s+)[A-Za-z0-9._~+/=-]{8,}", "$$1<redacted:token>") where IsMap(body)
              - replace_pattern(body, "(://[^:/\\s@]+:)[^@/\\s]+@", "$$1<redacted>@") where IsString(body)
              - replace_all_patterns(body, "value", "(://[^:/\\s@]+:)[^@/\\s]+@", "$$1<redacted>@") where IsMap(body)
              - replace_pattern(body, "(?i)\\b(password|passwd|pwd|secret|api[_-]?key|access[_-]?token|token)(\"?\\s*[:=]\\s*\"?)[^\"\\s,;&]+", "$$1$$2<redacted>") where IsString(body)
              - replace_all_patterns(body, "value", "(?i)\\b(password|passwd|pwd|secret|api[_-]?key|access[_-]?token|token)(\"?\\s*[:=]\\s*\"?)[^\"\\s,;&]+", "$$1$$2<redacted>") where IsMap(body)
              - replace_all_patterns(attributes, "value", "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}", "<redacted:email>")
              - 'replace_all_patterns(attributes, "value", "\\b[A-Z]{2}[0-9]{2}(?: ?[A-Z0-9]{4}){3,7}(?: ?[A-Z0-9]{1,3})?\\b", "<redacted:iban>")'
              - replace_all_patterns(attributes, "value", "\\b756\\.?[0-9]{4}\\.?[0-9]{4}\\.?[0-9]{2}\\b", "<redacted:ahv>")
              - replace_all_patterns(attributes, "value", "\\b(?:4[0-9]{3}|5[1-5][0-9]{2}|2[2-7][0-9]{2})(?:[ -]?[0-9]{4}){3}\\b", "<redacted:card>")
              - replace_all_patterns(attributes, "value", "\\b3[47][0-9]{2}[ -]?[0-9]{6}[ -]?[0-9]{5}\\b", "<redacted:card>")
              - replace_all_patterns(attributes, "value", "(?i)(bearer\\s+)[A-Za-z0-9._~+/=-]{8,}", "$$1<redacted:token>")
              - replace_all_patterns(attributes, "value", "(://[^:/\\s@]+:)[^@/\\s]+@", "$$1<redacted>@")
              - replace_all_patterns(attributes, "value", "(?i)\\b(password|passwd|pwd|secret|api[_-]?key|access[_-]?token|token)(\"?\\s*[:=]\\s*\"?)[^\"\\s,;&]+", "$$1$$2<redacted>")
              - replace_pattern(body, "\"name\":\"[^\"]*\"", "<redacted:customer-name>") where IsString(body) and attributes["tenant_id"] == "4721-prod"
              - replace_all_patterns(body, "value", "\"name\":\"[^\"]*\"", "<redacted:customer-name>") where IsMap(body) and attributes["tenant_id"] == "4721-prod"
              - replace_all_patterns(attributes, "value", "\"name\":\"[^\"]*\"", "<redacted:customer-name>") where attributes["tenant_id"] == "4721-prod"
        trace_statements:
          - context: span
            statements:
              - delete_matching_keys(attributes, "(?i)(^|[._-])(password|passwd|pwd|secret|client[_-]?secret|api[_-]?key|apikey|access[_-]?token|refresh[_-]?token|token|authorization|cookie|set[_-]?cookie|cvv|cvc|card[_-]?number)$$")
              - replace_all_patterns(attributes, "value", "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}", "<redacted:email>")
              - 'replace_all_patterns(attributes, "value", "\\b[A-Z]{2}[0-9]{2}(?: ?[A-Z0-9]{4}){3,7}(?: ?[A-Z0-9]{1,3})?\\b", "<redacted:iban>")'
              - replace_all_patterns(attributes, "value", "\\b756\\.?[0-9]{4}\\.?[0-9]{4}\\.?[0-9]{2}\\b", "<redacted:ahv>")
              - replace_all_patterns(attributes, "value", "\\b(?:4[0-9]{3}|5[1-5][0-9]{2}|2[2-7][0-9]{2})(?:[ -]?[0-9]{4}){3}\\b", "<redacted:card>")
              - replace_all_patterns(attributes, "value", "\\b3[47][0-9]{2}[ -]?[0-9]{6}[ -]?[0-9]{5}\\b", "<redacted:card>")
              - replace_all_patterns(attributes, "value", "(?i)(bearer\\s+)[A-Za-z0-9._~+/=-]{8,}", "$$1<redacted:token>")
              - replace_all_patterns(attributes, "value", "(://[^:/\\s@]+:)[^@/\\s]+@", "$$1<redacted>@")
              - replace_all_patterns(attributes, "value", "(?i)\\b(password|passwd|pwd|secret|api[_-]?key|access[_-]?token|token)(\"?\\s*[:=]\\s*\"?)[^\"\\s,;&]+", "$$1$$2<redacted>")
              - replace_all_patterns(attributes, "value", "\"name\":\"[^\"]*\"", "<redacted:customer-name>") where attributes["tenant_id"] == "4721-prod"
          - context: spanevent
            statements:
              - delete_matching_keys(attributes, "(?i)(^|[._-])(password|passwd|pwd|secret|client[_-]?secret|api[_-]?key|apikey|access[_-]?token|refresh[_-]?token|token|authorization|cookie|set[_-]?cookie|cvv|cvc|card[_-]?number)$$")
              - replace_all_patterns(attributes, "value", "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}", "<redacted:email>")
              - 'replace_all_patterns(attributes, "value", "\\b[A-Z]{2}[0-9]{2}(?: ?[A-Z0-9]{4}){3,7}(?: ?[A-Z0-9]{1,3})?\\b", "<redacted:iban>")'
              - replace_all_patterns(attributes, "value", "\\b756\\.?[0-9]{4}\\.?[0-9]{4}\\.?[0-9]{2}\\b", "<redacted:ahv>")
              - replace_all_patterns(attributes, "value", "\\b(?:4[0-9]{3}|5[1-5][0-9]{2}|2[2-7][0-9]{2})(?:[ -]?[0-9]{4}){3}\\b", "<redacted:card>")
              - replace_all_patterns(attributes, "value", "\\b3[47][0-9]{2}[ -]?[0-9]{6}[ -]?[0-9]{5}\\b", "<redacted:card>")
              - replace_all_patterns(attributes, "value", "(?i)(bearer\\s+)[A-Za-z0-9._~+/=-]{8,}", "$$1<redacted:token>")
              - replace_all_patterns(attributes, "value", "(://[^:/\\s@]+:)[^@/\\s]+@", "$$1<redacted>@")
