    service:
      # "detailed" surfaces the collector's own gRPC/HTTP receiver-handling
      # metrics (otelcol_rpc_server_*/otelcol_http_server_*) - needed for
      # the "RPC server/client"/"HTTP server/client" panels in the
      # OpenTelemetry Collector self-monitoring dashboard (15983), which
      # are otherwise permanently empty at the default "normal" level.
      telemetry:
        metrics:
          level: detailed
      extensions: [headers_setter]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resource/strip_source_namespace, k8sattributes/source, k8sattributes, resourcedetection]
          exporters:
            - routing/traces
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, resource/strip_source_namespace, k8sattributes/source, k8sattributes]
          exporters:
            - routing/metrics
        metrics/self:
          receivers: [prometheus/self]
          processors: [memory_limiter, batch]
          exporters: [prometheusremotewrite, debug]
        metrics/mimir-self:
          receivers: [prometheus/mimir-self]
          processors: [memory_limiter, batch]
          exporters: [prometheusremotewrite, debug]
        metrics/loki-self:
