---
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-agent
  namespace: observability
spec:
  mode: daemonset
  image: otel/opentelemetry-collector-contrib:0.166.0
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  # The collector image runs as a non-root user, but Kubernetes always
  # creates a hostPath directory as root-owned - fsGroup doesn't help
  # here (kubelet deliberately skips recursive chown for hostPath
  # volumes). This initContainer runs as root just long enough to make
  # the checkpoint directory writable before the real collector starts.
  initContainers:
    - name: init-checkpoint-dir
      image: busybox:1.38.0
      command: ["sh", "-c", "mkdir -p /var/lib/otelcol/file_storage && chmod 0777 /var/lib/otelcol/file_storage"]
      volumeMounts:
        - name: otelcol-checkpoint
          mountPath: /var/lib/otelcol/file_storage
  volumeMounts:
    - name: varlog
      mountPath: /var/log
      readOnly: true
    - name: hostfs
      mountPath: /hostfs
      readOnly: true
    - name: otelcol-checkpoint
      mountPath: /var/lib/otelcol/file_storage
  volumes:
    - name: varlog
      hostPath:
        path: /var/log
    - name: hostfs
      hostPath:
        path: /
    # Persistent per-node checkpoint for the filelog receiver's read
    # offsets (see the "file_storage" extension below) - without this, a
    # DaemonSet pod restart has no memory of what it already read and
    # re-reads every matching file from the beginning (start_at:
    # beginning), which once flooded Loki's ingestion limits on every
    # redeploy. hostPath (not emptyDir) so the checkpoint survives pod
    # restarts on the same node - DaemonSet pods always land back on the
    # node they were on.
    - name: otelcol-checkpoint
      hostPath:
        path: /var/lib/otelcol-checkpoint
        type: DirectoryOrCreate
  env:
    - name: NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
  config:
    extensions:
      file_storage:
        directory: /var/lib/otelcol/file_storage
        timeout: 1s

    connectors:
      # Container logs from filelog (below) are enriched with real
      # k8s.namespace.name/k8s.container.name resource attributes by the
      # filelog receiver's own "container" operator (path-based, see
      # that receiver's comment) - before this connector, every log from
      # every namespace still got exported with the same fixed
      # tenant_id: "4087-prod" header (this agent's own tenant), since a
      # DaemonSet serves the whole node, not one application. Found live
      # while reviewing 4139 (PostgreSQL, since folded into 4721's own
      # tenant - see README.md's Multi-Tenancy note): real postgres
      # container logs existed, just entirely under 4087-prod instead of
      # their owning tenant. A dedicated postgres-container rule
      # originally routed those separately under their own tenant; once
      # 4139 folded into 4721, that rule was removed since the
      # namespace-level rule below already covers it (postgres runs in
      # the same "kundenverwaltung" namespace).
      # GENERATED by scripts/provision.py (update_agent_log_routing(), F20)
      # from the manifests' k8s_namespaces: tenant namespaces -> their own
      # tenant, AGENT_PLATFORM_NAMESPACES and node logs without a namespace
      # (syslog, auth.log) -> 4087 (logs/platform), anything
      # else -> dropped (logs/unattributed) instead of landing silently in
      # the platform tenant.
      routing/logs:
        default_pipelines:
          - logs/unattributed
        error_mode: ignore
        table:
          - context: resource
            condition: attributes["k8s.namespace.name"] == nil
            pipelines:
              - logs/platform
          - context: resource
            condition: attributes["k8s.namespace.name"] == "calico-system"
            pipelines:
              - logs/platform
          - context: resource
            condition: attributes["k8s.namespace.name"] == "cert-manager"
            pipelines:
              - logs/platform
          - context: resource
            condition: attributes["k8s.namespace.name"] == "default"
            pipelines:
              - logs/platform
          - context: resource
            condition: attributes["k8s.namespace.name"] == "ingress-traefik"
            pipelines:
              - logs/platform
          - context: resource
            condition: attributes["k8s.namespace.name"] == "kube-node-lease"
            pipelines:
              - logs/platform
          - context: resource
            condition: attributes["k8s.namespace.name"] == "kube-public"
            pipelines:
              - logs/platform
          - context: resource
            condition: attributes["k8s.namespace.name"] == "kube-system"
            pipelines:
              - logs/platform
          - context: resource
            condition: attributes["k8s.namespace.name"] == "linkerd"
            pipelines:
              - logs/platform
          - context: resource
            condition: attributes["k8s.namespace.name"] == "linkerd-viz"
            pipelines:
              - logs/platform
          - context: resource
            condition: attributes["k8s.namespace.name"] == "observability"
            pipelines:
              - logs/platform
          - context: resource
            condition: attributes["k8s.namespace.name"] == "openclaw"
            pipelines:
              - logs/platform
          - context: resource
            condition: attributes["k8s.namespace.name"] == "opentelemetry-operator-system"
            pipelines:
              - logs/platform
          - context: resource
            condition: attributes["k8s.namespace.name"] == "tigera-operator"
            pipelines:
              - logs/platform
          - context: resource
            condition: attributes["k8s.namespace.name"] == "astronomy-shop"
            pipelines:
              - logs/ns-4720-prod
          - context: resource
            condition: attributes["k8s.namespace.name"] == "filestorage-demo"
            pipelines:
              - logs/ns-4015-prod
          - context: resource
            condition: attributes["k8s.namespace.name"] == "kundenverwaltung"
            pipelines:
              - logs/ns-4721-prod
          - context: resource
            condition: attributes["k8s.namespace.name"] == "netzwerk-demo"
            pipelines:
              - logs/ns-1294-prod
    receivers:
      hostmetrics:
        root_path: /hostfs
        collection_interval: 30s
        # No "processes" scraper - deliberately, see
        # instrumentation/platforms/1286-linux-basis/config.yaml's own comment (found
        # live there: unbounded per-process cardinality none of the
        # dashboards use anyway, and enough volume on its own to blow
        # through a tenant's ingestion_burst_size and cause the gateway
        # to drop data - collateral damage for whatever else shares its
        # export queue). Same risk here, times five nodes.
        scrapers:
          cpu: {}
          memory: {}
          disk: {}
          filesystem: {}
          network: {}
          load: {}
          paging: {}

      kubeletstats:
        collection_interval: 30s
        auth_type: serviceAccount
        endpoint: https://${env:NODE_NAME}:10250
        insecure_skip_verify: true
        # "volume" adds k8s.volume.* metrics (available/capacity/inodes)
        # for PVC-backed volumes - needed to see Mimir/Loki/Tempo/
        # Grafana's own persistent storage usage, not tracked anywhere
        # before this.
        metric_groups: [container, pod, node, volume]

      # Self-scrape of the collector's own internal metrics (:8888/metrics),
      # needed for the "OpenTelemetry Collector" self-monitoring dashboard -
      # otherwise otelcol_* metrics never reach Mimir, since nothing else
      # scrapes them.
      prometheus/self:
        config:
          scrape_configs:
            - job_name: otelcol
              scrape_interval: 30s
              static_configs:
                - targets: ["localhost:8888"]

      filelog:
        include:
          # The "container" operator's path-based metadata extraction
          # (format: containerd below) expects the REAL kubelet log files
          # under /var/log/pods/<namespace>_<pod>_<uid>/<container>/<N>.log,
          # not the /var/log/containers/*.log symlinks (whose naming
          # convention - <pod>_<namespace>_<container>-<containerID>.log -
          # it can't parse). Pointing it at the symlinks meant metadata
          # extraction silently failed for virtually every line
          # ("failed to detect a valid log path"), so the gateway's
          # connection-based k8sattributes fallback mislabeled every log as
          # coming from the agent pod itself instead of its real source.
          - /var/log/pods/*/*/*.log
          - /var/log/syslog
          - /var/log/auth.log
        exclude:
          - /var/log/pods/observability_otel-agent-collector-*/*/*.log
          - /var/log/pods/observability_otel-gateway-collector-*/*/*.log
        start_at: beginning
        include_file_path: true
        # Persists read offsets to the file_storage extension (see above)
        # so a pod restart resumes where it left off instead of re-reading
        # every file from the beginning.
        storage: file_storage
        operators:
          - type: container
            id: container-parser
            # AKS nodes run containerd (not CRI-O) - "format: crio" silently
            # failed to parse almost every container log line ("regex
            # pattern does not match"), so cluster-wide logs outside the
            # observability namespace never reached Loki.
            format: containerd

    processors:
      batch:
        send_batch_size: 8192
        timeout: 5s
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 25
      resourcedetection:
        detectors: [env, system]
      resource:
        attributes:
          - key: host.name
            value: ${env:NODE_NAME}
            action: upsert
          - key: service.namespace  # <--- ADD THESE LINES
            value: agent             # <---
            action: upsert
          - key: service.name        # <-- add
            value: node-hostmetrics  # <-- add
            action: upsert
          # schema/core.yaml's Core Schema - static per this
          # platform template, doesn't vary per tenant.
          - key: platform.type
            value: kubernetes
            action: upsert
          - key: platform.vendor
            value: azure-aks
            action: upsert
      transform/add_host_label:
        error_mode: ignore
        metric_statements:
          - context: datapoint
            statements:
              - set(attributes["host_name"], resource.attributes["host.name"])
              - set(attributes["host.name"], resource.attributes["host.name"])

    exporters:
      otlp/gateway:
        endpoint: otel-gateway-collector.observability.svc:4317
        tls:
          insecure: true
        # Multi-tenancy: this agent serves an entire node (every pod's
        # host/kubelet metrics, not one single application - see
        # routing/logs below for why container logs are handled
        # separately), so it's tagged with the Cloud Container
        # Plattform's own system_id (see observability-otel-demo-
        # onboarding manifests/platforms/4087-cloud-container-plattform.yaml
        # - system_id 4087, onboarded as 9001 originally, migrated) rather
        # than any one application's. The gateway's headers_setter
        # extension forwards this as X-Scope-OrgID to Mimir/Loki/Tempo.
        # Tenant convention is "<system_id>-<env>" (not just system_id) so
        # a system with multiple environments/budgets in its manifest gets
        # separately enforced limits per environment - see the onboarding
        # repo README's Multi-Tenancy section.
        headers:
          tenant_id: "4087-prod"

      # Per-tenant exporters for the routing/logs connector above - same
      # "one exporter per tenant, static tenant_id header" pattern the
      # VM platform templates use for their own otlp/host exporter (see
      # instrumentation/platforms/).
      nop: {}
      otlp/gateway-1294-prod:
        endpoint: otel-gateway-collector.observability.svc:4317
        tls:
          insecure: true
        headers:
          tenant_id: 1294-prod
      otlp/gateway-4015-prod:
        endpoint: otel-gateway-collector.observability.svc:4317
        tls:
          insecure: true
        headers:
          tenant_id: 4015-prod
      otlp/gateway-4720-prod:
        endpoint: otel-gateway-collector.observability.svc:4317
        tls:
          insecure: true
        headers:
          tenant_id: 4720-prod
      otlp/gateway-4721-prod:
        endpoint: otel-gateway-collector.observability.svc:4317
        tls:
          insecure: true
        headers:
          tenant_id: 4721-prod
    service:
      extensions: [file_storage]
      pipelines:
        metrics:
          receivers: [hostmetrics, kubeletstats]
          processors: [memory_limiter, resourcedetection, resource, transform/add_host_label, batch]
          exporters: [otlp/gateway]
        # Separate pipeline for the otelcol self-scrape: it must NOT go
        # through the "resource" processor above, which unconditionally
        # overwrites service.name/service.namespace to "node-hostmetrics"/
        # "agent" - that would destroy the job/service.name identity the
        # Prometheus receiver derives from the scrape config (job=otelcol),
        # which the self-monitoring dashboard's $job variable depends on.
        metrics/self:
          receivers: [prometheus/self]
          processors: [memory_limiter, batch]
          exporters: [otlp/gateway]
        logs:
          receivers: [filelog]
          processors: [memory_limiter, resource, batch]
          exporters: [routing/logs]
        logs/platform:
          receivers: [routing/logs]
          exporters: [otlp/gateway]
        logs/unattributed:
          receivers:
            - routing/logs
          exporters:
            - nop
        logs/ns-1294-prod:
          receivers:
            - routing/logs
          exporters:
            - otlp/gateway-1294-prod
        logs/ns-4015-prod:
          receivers:
            - routing/logs
          exporters:
            - otlp/gateway-4015-prod
        logs/ns-4720-prod:
          receivers:
            - routing/logs
          exporters:
            - otlp/gateway-4720-prod
        logs/ns-4721-prod:
          receivers:
            - routing/logs
          exporters:
            - otlp/gateway-4721-prod
