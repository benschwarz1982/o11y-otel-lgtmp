---
# G02 (FR-05) test patterns for the gateway's transform/redact processor
# (generated by scripts/provision.py). scripts/test-redaction.py runs the
# real processor from otel-gateway-collector.yaml over each `input` (as
# log body and as log attribute) and compares with `expect`.
# tenant: sets the tenant_id attribute, for manifest-specific rules.
# attributes: extra log attributes; expect_absent: attributes that must
# be deleted. A map input becomes a structured body (body checked only).
samples:
  - input: "Created customer for anna.muster@example.ch"
    expect: "Created customer for <redacted:email>"
  - input: "Refund to CH93 0076 2011 6238 5295 7 done"
    expect: "Refund to <redacted:iban> done"
  - input: "IBAN DE89370400440532013000"
    expect: "IBAN <redacted:iban>"
  - input: "AHV 756.1234.5678.97 checked"
    expect: "AHV <redacted:ahv> checked"
  - input: "card 4111 1111 1111 1111 declined"
    expect: "card <redacted:card> declined"
  - input: "amex 3782-822463-10005"
    expect: "amex <redacted:card>"
  - input: "Authorization: Bearer eyJhbGciOiJIUzI1NiJ9.e30.abc"
    expect: "Authorization: Bearer <redacted:token>"
  - input: "connecting to postgres://app:s3cr3t@db:5432/app"
    expect: "connecting to postgres://app:<redacted>@db:5432/app"
  - input: 'login failed password=hunter2 user=bob'
    expect: 'login failed password=<redacted> user=bob'
  - input: '{"api_key": "abc123def", "x": 1}'
    expect: '{"api_key": "<redacted>", "x": 1}'
  # Must stay unchanged: trace IDs, timestamps, plain numbers.
  - input: "trace_id=4bf92f3577b34da6a3ce929d0e0e4736 took 1234 ms at 2026-11-20T10:00:00Z"
    expect: "trace_id=4bf92f3577b34da6a3ce929d0e0e4736 took 1234 ms at 2026-11-20T10:00:00Z"
  # Manifest rule of 4721 (redaction.patterns customer-name) - only for
  # its own tenant.
  - input: 'Created customer: {"name":"Anna Muster","email":"anna@example.ch"}'
    tenant: 4721-prod
    expect: 'Created customer: {<redacted:customer-name>,"email":"<redacted:email>"}'
  - input: 'Created customer: {"name":"Anna Muster"}'
    tenant: 4722-prod
    expect: 'Created customer: {"name":"Anna Muster"}'
  # Credential by attribute NAME (value has no "password=" prefix):
  # deleted, not masked.
  - input: "login failed"
    attributes: {password: hunter2, http.request.header.authorization: "Basic YWxhZGRpbjpvcGVu", user: bob}
    expect_absent: [password, http.request.header.authorization]
    expect: "login failed"
  # Astronomy Shop emitRawPii flag (demo 3.1): card verification code.
  - input: "charge"
    attributes: {demo.payment.card_cvv: "123", demo.payment.card_cvc: "456", demo.payment.card_number: "6011000990139424"}
    expect_absent: [demo.payment.card_cvv, demo.payment.card_cvc, demo.payment.card_number]
    expect: "charge"
  # Structured (map) body: top-level values masked, credential keys deleted.
  - input: {event: signup, contact: anna.muster@example.ch, api_key: abc123def}
    expect: {event: signup, contact: "<redacted:email>"}
