; For local/manual runs only - Ansible refuses to load this file at all
; when the checkout directory is world-writable, which GitLab CI's
; docker executor checkout is (found live: "ignoring it as an
; ansible.cfg source"). The instrumentation-1286-linux-basis/
; instrumentation-1229-windows-basis CI jobs therefore pass the
; inventory/roles_path settings below explicitly instead
; (-i/$ANSIBLE_ROLES_PATH) rather than relying on this file.
[defaults]
inventory = inventory/generated.ini
roles_path = roles
host_key_checking = True
; F08: the CI jobs pin each VM's host key (terraform output
; ssh_host_public_key, read over the Azure control plane - a rebuilt VM
; gets its new key the same way) into /tmp/known_hosts.

[ssh_connection]
pipelining = True
