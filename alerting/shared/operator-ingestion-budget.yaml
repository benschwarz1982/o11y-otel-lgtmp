---
# UC4 - Multi-Tenancy: Ingestion Budget Enforcement (previously UC5;
# moved up when UC4/Object Storage Usage was dropped outright - see
# alerting/README.md). Cross-tenant operator view - any tenant that has
# used up its actual daily ingestion budget ON ANY ONE OF the four
# signals (Metrics/Logs/Traces/Profiles) - fires one alert instance per
# breaching (tenant, signal) pair, not per tenant (NFR-05: each signal
# has its own independent budget now, see the query's own comment
# below for why this is no longer one blended budget summed across all
# four). Rules only - see alerting/README.md. Grafana folder is flat
# "shared" (not nested under any one system - cross-tenant, no single
# owning system_id) - same top-level folder its own dashboard lives in.
#
# This rule went through three earlier, replaced designs,
# each found live to measure the wrong thing:
#
# 1. A discard-count alert (cortex_discarded_samples_total{reason=
#    "rate_limited"} > 0) - fires on ANY momentary burst over the
#    burst_size limit, even for a tenant whose sustained rate is a
#    small fraction of its budget - a rate limiter has no memory of
#    usage earlier in the day, so "discarded something just now" and
#    "used up today's budget" are genuinely different conditions.
# 2. A single-signal (Mimir-only) smoothed-rate percentage - fixed the
#    discard-noise problem above, but still wasn't measuring the actual
#    Use Case (a tenant's combined daily budget across every signal).
# 3. A rolling-24h `metric - metric @ start()` version, mirroring the
#    dashboard's own (correct, calendar-day) approach as closely as an
#    alert rule's fixed `relativeTimeRange` allows - found live this
#    genuinely fluctuates up AND down as older high-activity periods
#    age out of the rolling window, which isn't "how much of today's
#    budget has been used" either (confirmed live: read 83.6%, then
#    54.8% moments later, then back over 100%, purely from the window
#    rolling forward - not from anything about the tenant's actual
#    behavior changing that fast).
#
# This version reads demo_ingestion_since_midnight{signal=...,
# tenant=...} directly - a gauge pushed every 2 minutes by the
# `ingestion-midnight-snapshot` CronJob (terraform/environments/
# observability-stack/main.tf, running scripts/
# ingestion-midnight-snapshot.py), already computed there as each
# tenant/signal's real ingested volume since actual local midnight
# (reset-tolerant, per-series-then-aggregated - see that script's own
# query_since_midnight() for the full reasoning; Mimir's own ruler that
# would otherwise give this natively via a recording rule is
# deliberately scaled to 0 in this repo, see
# helm/values/mimir-values.yaml, not reactivated just for this). This
# alert (and the dashboard's own matching panel, dashboards/shared/
# operator-tenant-budget.json, and every per-tenant dashboard's own
# panel) just divides that value by the same signal's own daily budget
# - no subtraction, no rolling window, no `@` modifier here at all
# anymore.
#
# NFR-05 SECOND pre-test audit round, fixed here: this used to
# recompute "current counter value minus a separately-pushed day-start
# snapshot" independently, in the alert's/dashboard's OWN PromQL,
# duplicating (and able to silently disagree with) whatever
# ingestion-midnight-snapshot.py itself was internally deciding to
# throttle on - and had its own version of that script's pre-fix
# reset-insensitivity (a raw subtraction, no compensation), since
# Prometheus's counter-reset handling must happen PER SERIES before any
# aggregation, which a plain "current - snapshot" never does. Now both
# this alert and the enforcer read the exact same, already-correct
# value - a single source of truth, not two independently-computed
# approximations of the same thing.
#
# Percentage denominator is that SIGNAL's own daily budget, read
# directly from demo_ingestion_daily_budget{tenant=..., signal=...} -
# pushed by the same CronJob/script, straight from
# helm/values/ingestion-daily-budgets.yaml (itself generated by
# scripts/provision.py's compute_overrides()). NFR-05 FIRST round
# finding, fixed then: this used to be ONE combined
# demo_ingestion_daily_budget_bytes{tenant=...} value, and all four
# signals' since-midnight deltas were summed and divided by it as one
# blended percentage - which mixed genuinely different bases (Loki/
# Tempo's real uncompressed bytes, Pyroscope's real but COMPRESSED
# bytes, and Mimir's pure sample-count *1000 guess, since Mimir has no
# byte counter at all) as if they were one comparable unit, and meant a
# tenant heavy on one signal could push the blended total over 100% and
# get flagged even if every individual signal was still well under its
# own reasonable share. Since both metrics already carry the same
# (tenant, signal) label pair natively (SINCE_MIDNIGHT_METRIC and
# BUDGET_METRIC are pushed with identical extra_labels dicts - see
# ingestion-midnight-snapshot.py's main()), a plain `on(tenant, signal)`
# match is enough - no group_left, no label_replace, no `or`-unioned
# per-signal sub-expressions needed anymore: this single division
# already produces one result series per (tenant, signal) pair on its
# own.
apiVersion: 1
groups:
  - orgId: 1
    name: operator-ingestion-budget
    folder: "shared"
    interval: 1m
    rules:
      - uid: alert-shared-ingestion-rate-critical
        title: "Tenant ingestion budget exhausted (>100% of daily budget)"
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: mimir-anonymous
            model:
              expr: 100 * demo_ingestion_since_midnight / on(tenant, signal) demo_ingestion_daily_budget
              instant: false
              range: true
              refId: A
          # reduce stage - see alerting/platforms/1286-linux-basis/
          # alert-rules.yaml for why this is required (found live,
          # missing on every rule in this repo). Grafana's reduce/
          # threshold expressions operate per-series, so this fires one
          # alert instance per breaching (tenant, signal) PAIR (both the
          # `tenant` and `signal` labels are preserved through B into
          # C), not just a single collapsed value across all tenants -
          # or, pre-NFR-05, all signals.
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [100]}
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Tenant/signal has used up its daily ingestion budget"
          description: "A tenant's ingested volume on one signal (Metrics/Logs/Traces/Profiles - see the {{ $labels.signal }} label) since real local midnight (Europe/Zurich), computed by scripts/ingestion-midnight-snapshot.py and refreshed every 2 minutes by the ingestion-midnight-snapshot CronJob, has exceeded 100% of that signal's own daily budget (the manifest `size` tier - see scripts/provision.py's compute_overrides()). Each signal has its own independent budget - this does not mean the tenant's other signals are also over budget."
          # Links this cross-tenant rule to the shared Operator
          # dashboard (not any one tenant's own dashboard, since this
          # alert isn't scoped to one) - see 1286's alert-rules.yaml
          # for why this linking is required at all (found live,
          # missing on every rule in this repo).
          __dashboardUid__: "operator-tenant-budget"
          __panelId__: "1"
      # Enforcement health - found live after an onboarding: seven new
      # tenants had usage but no daily budget (the budgets file wasn't
      # rolled out), so nothing could ever throttle them, and the only
      # symptom was an empty dashboard panel. Fires per tenant with
      # since-midnight usage on a signal that has no positive budget, and
      # once (tenant="all") when
      # the enforcer pushes nothing at all - CronJob broken, or budgets
      # ConfigMap missing (the script then skips with a WARNING). Only
      # real tenant ids (NNNN-env) count, "anonymous"/"self-monitoring"
      # carry usage but deliberately no budget.
      # G15 (NFR-05): early warning at 80%, before the budget is
      # exhausted and the enforcer throttles. Visible in Grafana's
      # Alerting page only (no mail delivery in this demo - same as the
      # critical rule above); the per-tenant dashboards show the same
      # percentage.
      - uid: alert-shared-ingestion-budget-warning
        title: "Tenant ingestion budget almost exhausted (>80% of daily budget)"
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: mimir-anonymous
            model:
              expr: 100 * demo_ingestion_since_midnight / on(tenant, signal) demo_ingestion_daily_budget
              instant: false
              range: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: within_range, params: [80, 100]}
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.tenant }} has used more than 80% of its daily {{ $labels.signal }} budget"
          description: "Tenant {{ $labels.tenant }} has ingested more than 80% of its daily {{ $labels.signal }} budget since local midnight (Europe/Zurich). At 100% the ingestion-midnight-snapshot CronJob throttles this signal until midnight. Reduce volume or request a larger size via the self-service form."
          __dashboardUid__: "operator-tenant-budget"
          __panelId__: "1"
      - uid: alert-shared-ingestion-budget-missing
        title: "Ingestion budget not enforced for a tenant"
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: mimir-anonymous
            model:
              # Per (tenant, signal): budgets are enforced per signal,
              # and a budget of 0 is skipped by the enforcer too.
              expr: count by (tenant) (demo_ingestion_since_midnight{tenant=~"[0-9]{4}-.+"} unless on(tenant, signal) (demo_ingestion_daily_budget > 0)) or on() label_replace(absent_over_time(demo_ingestion_since_midnight[15m]), "tenant", "all", "", "")
              instant: true
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
              refId: C
        # No result = every tenant has a budget and the enforcer runs -
        # the healthy state, not missing data.
        noDataState: OK
        execErrState: Error
        for: 10m
        # runbook_key: consumed by alerting/shared/openclaw-webhook.yaml,
        # which routes this alert to OpenClaw -
        # sre/runbooks/shared-ingestion-budget-missing.md (diagnosis only).
        labels:
          runbook_key: shared-ingestion-budget-missing
        annotations:
          summary: "Daily ingestion budget is not being enforced for {{ $labels.tenant }}"
          description: "Tenant {{ $labels.tenant }} has ingestion usage on at least one signal without a positive daily budget (demo_ingestion_daily_budget), or (tenant=all) the ingestion-midnight-snapshot CronJob has pushed no usage at all for 15 minutes. Its budget is then not enforced. Check that the tenant-ingestion-budgets ConfigMap exists and lists the tenant (it is rolled out by tenants:rollout), and the CronJob's latest job log."
          __dashboardUid__: "operator-tenant-budget"
          __panelId__: "1"
